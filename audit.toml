# cargo-audit configuration (https://rustsec.org).
#
# ── RUSTSEC-2026-0154 — russh "unbounded 32-bit allocation" (DoS), russh < 0.60.3 ──
#
# History: while xenterm was on russh 0.49 this advisory was ignored here — the
# flaw (unchecked ssh-agent frame length) was unreachable because xenterm never
# uses the ssh-agent, and the only fixed releases (>= 0.60.3) pulled a stack of
# pre-release crypto crates (ed25519-dalek 3.0.0-pre, aes-gcm 0.11.0-rc, …).
#
# PR #89 upgraded to russh 0.61.2, which contains the fix, so the ignore entry
# is gone. Two trade-offs from that upgrade remain deliberate and are recorded
# in Cargo.toml: the crypto backend is pinned to `ring` (russh's default
# aws-lc-rs pulls aws-lc-sys, which needs NASM and breaks every CI platform),
# and the crypto stack is still pre-release (ssh-key 0.7.0-rc, ed25519-dalek
# 3.0.0-rc) — revisit when it stabilises.
[advisories]
ignore = []
