name: Release

# One workflow, one artifact set: the Flutter desktop application (UI + the
# full Rust core inside xenterm_bridge) for Windows, Linux x86_64 and macOS
# (Apple Silicon + Intel). Windows additionally ships a per-machine MSI
# installer (packaging/windows/main.wxs) next to the portable zip; the other
# platforms keep their portable archive only.
#   - push a tag `vX.Y.Z`  -> stable mode; once every build succeeds, all
#     artifacts attach to the GitHub Release in one step (no partial releases).
#   - push to main         -> beta mode; replaces the single rolling `beta`
#     pre-release. Feature branches never build releases (ci.yml covers them).
#   - workflow_dispatch    -> mode input: `beta` (default, publish rolling beta),
#     `stable` (attach to the selected tag's release — retry path for a failed
#     tag build), `dry-run` (build artifacts only, publish nothing).
# The CLI/MCP service core is not packaged here: it ships inside the desktop
# archives' bridge library, and automation users build it from source.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "beta = rolling beta; stable = attach to the selected tag's release; dry-run = artifacts only"
        type: choice
        options: [beta, stable, dry-run]
        default: beta

permissions:
  contents: write   # needed to create / update the GitHub Release

# Same ref: a newer run cancels the older one (rolling beta). Different tags
# never cancel each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve mode and version
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}           # stable | beta | dry-run
      version: ${{ steps.resolve.outputs.version }}     # artifact naming: vX.Y.Z | beta-<sha7> | <ref>
      xt_version: ${{ steps.resolve.outputs.xt_version }}  # app version from scripts/version.sh (版本号规范 v1)
    steps:
      - uses: actions/checkout@v4
      - name: Resolve mode and version
        id: resolve
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -eu
          CARGO_VERSION="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' crates/xenterm/Cargo.toml | head -n 1)"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            MODE=stable
            VERSION="$GITHUB_REF_NAME"
            LOCK_VERSION="$(awk '
              $0 == "name = \"xenterm\"" { found = 1; next }
              found && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.lock)"
            if [ "${VERSION#v}" != "$CARGO_VERSION" ]; then
              echo "Tag ${VERSION} does not match Cargo.toml version ${CARGO_VERSION}."
              echo "Run: pwsh ./scripts/release.ps1 ${VERSION}"
              exit 1
            fi
            if [ "${VERSION#v}" != "$LOCK_VERSION" ]; then
              echo "Tag ${VERSION} does not match Cargo.lock xenterm version ${LOCK_VERSION}."
              echo "Run: pwsh ./scripts/release.ps1 ${VERSION}"
              exit 1
            fi
          elif [ "$INPUT_MODE" = "stable" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "Mode 'stable' requires dispatching on a tag ref (got ${GITHUB_REF_NAME:-<none>})."
              exit 1
            fi
            MODE=stable
            VERSION="$GITHUB_REF_NAME"
          elif [ "$INPUT_MODE" = "dry-run" ]; then
            MODE=dry-run
            # A ref name may contain "/" (a branch like ixbai/dev); a version
            # must not, or every path built from it (staging dirs, artifact
            # names) tries to create a directory that does not exist.
            VERSION="$(echo "${GITHUB_REF_NAME:-dev}" | tr '/' '-')"
          else
            MODE=beta
            VERSION="beta-${GITHUB_SHA::7}"
          fi
          echo "mode=$MODE"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # App version string per 版本号规范 v1: scripts/version.sh is the
          # single assembly point. Tag refs resolve to xt-vX.Y.Z; the rolling
          # beta leg forces the beta channel via XT_CHANNEL; other refs derive
          # from their branch (usually dev).
          if [ "$MODE" = "beta" ]; then
            XT_APP_VERSION="$(XT_CHANNEL=beta bash scripts/version.sh)"
          else
            XT_APP_VERSION="$(bash scripts/version.sh)"
          fi
          printf '%s' "$XT_APP_VERSION" | grep -Eq \
            '^xt-(v[0-9]+\.[0-9]+\.[0-9]+|(beta|alpha|dev)-[0-9a-f]{7}-T[0-9]{10})$' \
            || { echo "scripts/version.sh produced an invalid version: $XT_APP_VERSION"; exit 1; }
          echo "xt_version=$XT_APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "app version: $XT_APP_VERSION"

  # The only product: the desktop application. Each archive contains the UI,
  # its assets and the platform's xenterm_bridge library (the whole Rust core).
  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.mode != 'beta' || github.repository == 'ixbaicn/XenTerm' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # The xenterm build script embeds the version: pin the already-validated
      # string from prepare instead of letting version.sh derive a channel
      # from the branch name (invalid on e.g. `flutter`).
      XT_VERSION: ${{ needs.prepare.outputs.xt_version }}
      # build.rs runs scripts/version.sh via bash; on Windows the Git Bash on
      # PATH is not guaranteed for pwsh steps, and C:\Windows\System32\bash.exe
      # is the WSL launcher (build.rs skips it). Pin the real Git Bash.
      XT_BASH: 'C:\Program Files\Git\bin\bash.exe'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows, name: windows-x86_64 }
          - { os: ubuntu-22.04, platform: linux, name: linux-x86_64 }
          # No linux-aarch64 here: Flutter does not publish an arm64 Linux
          # SDK tarball, so the desktop app stays x86_64-only.
          - { os: macos-15, platform: macos, name: macos-aarch64 }
          - { os: macos-15-intel, platform: macos, name: macos-x86_64 }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build clang \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libudev-dev libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-${{ matrix.name }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve Flutter build name
        id: appver
        shell: bash
        run: |
          set -eu
          V="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' crates/xenterm/Cargo.toml | head -n 1)"
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Build FFI bridge
        run: cargo build --release --locked -p xenterm-bridge

      - name: Build Flutter desktop app
        working-directory: apps/xenterm
        # One line, no shell continuations: the default Windows shell is pwsh.
        run: flutter pub get && flutter build ${{ matrix.platform }} --release --build-name=${{ steps.appver.outputs.name }} --build-number=${{ github.run_number }}

      - name: Bundle the bridge next to the app
        shell: bash
        run: bash apps/xenterm/tool/bundle_native.sh

      - name: Smoke-test the macOS bridge bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -eu
          DYLIB="$PWD/apps/xenterm/build/macos/Build/Products/Release/xenterm_app.app/Contents/Frameworks/libxenterm_bridge.dylib"
          test -f "$DYLIB"
          codesign --verify --verbose=2 "$DYLIB"
          cd apps/xenterm
          XENTERM_BRIDGE_PATH="$DYLIB" flutter test test/native_bridge_smoke_test.dart

      - name: Package desktop archive
        shell: bash
        run: |
          set -eu
          ASSET="$(bash apps/xenterm/tool/package_desktop.sh "$VERSION" | tail -n 1)"
          test -f "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Install pinned WiX Toolset 3.14.1
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $wix = & "$env:GITHUB_WORKSPACE\scripts\install-wix.ps1"
          if ([string]::IsNullOrWhiteSpace($wix) -or -not (Test-Path -LiteralPath (Join-Path $wix "candle.exe"))) {
            throw "scripts/install-wix.ps1 did not return a usable WiX bin directory: '$wix'"
          }
          Write-Host "WiX bin: $wix"
          "WIX_BIN=$wix" >> $env:GITHUB_ENV

      - name: Build the Windows MSI installer
        if: matrix.platform == 'windows'
        shell: pwsh
        # Same naming as the archive: xenterm-<version>-windows-x86_64.msi.
        # ProductVersion comes from the crate version (vX.Y.Z tags) and the
        # artefact version (tag / beta hash) is recorded in the installer.
        run: |
          # The packaging script's pipeline output is the MSI path only; take the
          # last line anyway so a stray Write-Output cannot corrupt the upload
          # path again (this produced a silently empty installer artifact once).
          $output = & "$env:GITHUB_WORKSPACE\apps\xenterm\tool\package_windows_installer.ps1" -Version $env:VERSION -WixBin $env:WIX_BIN
          $msi = @($output) | Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace($msi) -or -not (Test-Path -LiteralPath $msi -PathType Leaf)) {
            throw "MSI was not created (got '$msi')"
          }
          Write-Host "MSI: $msi"
          "MSI=$msi" >> $env:GITHUB_ENV

      - name: Upload desktop application
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ env.ASSET }}

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: ${{ env.MSI }}

  publish:
    name: Publish
    needs: [prepare, build]
    if: needs.prepare.outputs.mode != 'dry-run'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Attach all artifacts to the GitHub Release
        if: needs.prepare.outputs.mode == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          # Custom fork builds must stay separate from upstream stable releases.
          prerelease: ${{ github.repository != 'ixbaicn/XenTerm' }}
          make_latest: ${{ github.repository == 'ixbaicn/XenTerm' && 'true' || 'false' }}
          files: dist/*
          fail_on_unmatched_files: true

      - name: Replace the rolling beta release
        # Fork releases must never touch the upstream's rolling beta.
        if: needs.prepare.outputs.mode == 'beta' && (github.repository == 'ixbaicn/XenTerm' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Drop the rolling beta release/tag...
          gh release delete beta --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          # Versioned preview releases belong to the user and are never purged.
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create beta dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Beta (${SHORT_SHA})" \
            --notes "自动构建的预览版（beta），来自 commit ${SHORT_SHA}。每次代码提交都会替换此预览版，始终只保留最新一个。"
