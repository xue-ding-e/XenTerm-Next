name: CI

# Push/PR gate for the current architecture (see AGENTS.md): the Rust service
# core plus the Flutter desktop UI, no GPUI.
#   - rust:            cargo check + tests of the service core and the FFI bridge
#   - headless-e2e:    headless unit tests + the Python end-to-end regressions
#   - migration-e2e:   migration CLI regressions on all three OSes
#   - windows-ssh:     Windows command-stack / SSH e2e
#   - flutter:         flutter analyze + widget tests of the desktop UI
#   - flutter-desktop: real three-platform desktop build + bridge bundling and
#                      archive packaging smoke (catches "UI missing" releases)
#   - linux-installer: Linux install/uninstall/upgrade test suite for the
#                      release bundle installer
#   - windows-installer: MSI toolchain/packaging/upgrade smoke test
#
# The old GPUI desktop jobs (cargo check of the GUI crate, ui::session_editor
# and ui::dialog_parity_tests, full desktop suite) were deleted with the GPUI
# UI: crates/xenterm is now the headless service core.
#
# Release packaging lives in release.yml.

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/xenterm/**"
      - "apps/xenterm/**"
      - "scripts/**"
      - "packaging/**"
      - "tests/**"
      - "assets/install-linux.sh"
      - "assets/xenterm.ico"
      - "assets/xenterm.desktop"
      - "assets/icon@512.png"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/xenterm/**"
      - "apps/xenterm/**"
      - "scripts/**"
      - "packaging/**"
      - "tests/**"
      - "assets/install-linux.sh"
      - "assets/xenterm.ico"
      - "assets/xenterm.desktop"
      - "assets/icon@512.png"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# crates/xenterm/build.rs runs scripts/version.sh through bash; on Windows the
# runner's Git Bash is not guaranteed to be on PATH for pwsh steps (build.rs
# deliberately skips C:\Windows\System32\bash.exe, the WSL launcher). Pin it.
env:
  XT_BASH: 'C:\Program Files\Git\bin\bash.exe'

jobs:
  rust:
    name: Rust core and bridge (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: Linux }
          - { os: windows-latest, name: Windows }
          - { os: macos-14, name: macOS }
    steps:
      - uses: actions/checkout@v4
      # 版本号规范 v1 §4/§7: resolve the version through the single entry
      # point, re-check the §1 format, and pin it for the cargo steps so the
      # built test binaries embed exactly this string. version.sh also fails
      # when apps/xenterm/pubspec.yaml drifts from the crate version.
      - name: Resolve app version
        shell: bash
        run: |
          set -eu
          V="$(bash scripts/version.sh)"
          printf '%s' "$V" | grep -Eq \
            '^xt-(v[0-9]+\.[0-9]+\.[0-9]+|(beta|alpha|dev)-[0-9a-f]{7}-T[0-9]{10})$' \
            || { echo "scripts/version.sh produced an invalid version: $V"; exit 1; }
          echo "XT_VERSION=$V" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # serialport's Linux port enumeration needs libudev; the default
        # `secrets-native` feature enables keyring/sync-secret-service, whose
        # dbus-secret-service backend links libdbus-1. rusqlite bundles SQLite
        # and needs only a C compiler, which the image has.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-core-${{ matrix.name }}
      - name: Check the workspace
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xenterm-ci-config
          XDG_DATA_HOME: ${{ runner.temp }}/xenterm-ci-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xenterm-ci-runtime
        run: cargo check --locked --jobs 2
      # The Linux runner runs the complete suite (core unit tests + the
      # xenterm-bridge FFI integration tests); the full suite has always been
      # validated there. Windows/macOS run the bridge FFI tests, and the
      # Windows-only core tests are covered by the windows-ssh job, so the
      # matrix stays inside a sane CI budget.
      - name: Test the workspace (Linux)
        if: runner.os == 'Linux'
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xenterm-ci-config
          XDG_DATA_HOME: ${{ runner.temp }}/xenterm-ci-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xenterm-ci-runtime
        run: cargo test --locked --jobs 2 -- --test-threads=1
      - name: Test the FFI bridge (Windows/macOS)
        if: runner.os != 'Linux'
        run: cargo test --locked --jobs 2 -p xenterm-bridge

  flutter:
    name: Flutter analyze and widget tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Analyze
        working-directory: apps/xenterm
        run: |
          flutter pub get
          flutter analyze
      - name: Widget tests
        working-directory: apps/xenterm
        run: flutter test

  # Compile the real desktop application (not just the Rust core) and exercise
  # the release packaging scripts, so an archive can never regress to "UI
  # missing" or a broken bundle layout.
  flutter-desktop:
    name: Flutter desktop build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, name: linux }
          - { os: windows-latest, platform: windows, name: windows }
          - { os: macos-15, platform: macos, name: macos }
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake ninja-build clang libgtk-3-dev liblzma-dev libstdc++-12-dev libudev-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-flutter-${{ matrix.name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Build FFI bridge
        run: cargo build --release --locked -p xenterm-bridge
      - name: Resolve the Flutter build name
        id: appver
        shell: bash
        # The crate version is the single source; the pubspec mirrors it and
        # scripts/version.sh fails a build where the two drift.
        run: |
          set -eu
          V="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' crates/xenterm/Cargo.toml | head -n 1)"
          [ -n "$V" ] || { echo "cannot read the crate version from crates/xenterm/Cargo.toml"; exit 1; }
          echo "name=$V" >> "$GITHUB_OUTPUT"
      - name: Build desktop app
        working-directory: apps/xenterm
        run: |
          flutter pub get
          flutter build ${{ matrix.platform }} --release --build-name=${{ steps.appver.outputs.name }} --build-number=${{ github.run_number }}
      - name: Verify the bridge is bundled
        shell: bash
        run: bash apps/xenterm/tool/bundle_native.sh
      - name: Package the desktop archive (packaging smoke)
        shell: bash
        run: |
          set -eu
          ASSET="$(bash apps/xenterm/tool/package_desktop.sh "ci-${{ matrix.name }}")"
          test -f "$ASSET"
          echo "packaged $ASSET"
      - name: Smoke-test the packaged macOS bridge
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -eu
          DYLIB="$PWD/apps/xenterm/build/macos/Build/Products/Release/xenterm_app.app/Contents/Frameworks/libxenterm_bridge.dylib"
          test -f "$DYLIB"
          codesign --verify --verbose=2 "$DYLIB"
          cd apps/xenterm
          XENTERM_BRIDGE_PATH="$DYLIB" flutter test test/native_bridge_smoke_test.dart

      - name: Smoke-test the packaged Linux bridge
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -eu
          SO="$PWD/apps/xenterm/build/linux/x64/release/bundle/lib/libxenterm_bridge.so"
          test -f "$SO"
          cd apps/xenterm
          XENTERM_BRIDGE_PATH="$SO" flutter test test/native_bridge_smoke_test.dart

      - name: Smoke-test the packaged Windows bridge
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'apps\xenterm\build\windows\x64\runner\Release\xenterm_bridge.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw "missing packaged bridge: $dll" }
          $env:XENTERM_BRIDGE_PATH = $dll
          Push-Location apps/xenterm
          try { flutter test test/native_bridge_smoke_test.dart } finally { Pop-Location }

      - name: Validate the Windows installer inputs
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\apps\xenterm\tool\package_windows_installer.ps1" -Version xt-ci-dry-run -DryRun

  migration-e2e:
    name: ${{ matrix.os }} migration CLI regression
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test version metadata serialization
        shell: bash
        run: |
          # Pass the running shell explicitly: Python on Windows could otherwise
          # select System32/bash.exe (the WSL launcher) before Git Bash.
          export VERSION_TEST_BASH="$BASH"
          if [ "$RUNNER_OS" = Windows ]; then
            export VERSION_TEST_BASH="$(cygpath -w "$BASH")"
          fi
          python crates/xenterm/tests/version_metadata_test.py
      - uses: Swatinem/rust-cache@v2
        with:
          key: migration-cli-${{ runner.os }}
      # Synthetic independent profiles only; no real credentials.
      # serialport's Linux enumeration needs libudev.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
      - name: Build the headless CLI binary
        run: cargo build -p xenterm --locked --no-default-features --features headless --jobs 2
      - name: Stable-ID import and native snapshot migration
        run: python crates/xenterm/tests/migration_modes_e2e.py --exe "${{ runner.os == 'Windows' && 'target/debug/xenterm.exe' || 'target/debug/xenterm' }}"
      - name: Read-only full CLI migration previews
        run: python crates/xenterm/tests/migration_preview_e2e.py --exe "${{ runner.os == 'Windows' && 'target/debug/xenterm.exe' || 'target/debug/xenterm' }}"

  headless-e2e:
    name: Headless core and MCP e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y nginx libudev-dev pkg-config
      - run: python -m pip install cryptography paramiko "mcp>=2.3,<3"
      - name: Headless unit tests (no GUI system dependencies)
        run: env -u ALL_PROXY -u all_proxy -u HTTP_PROXY -u http_proxy -u HTTPS_PROXY -u https_proxy cargo test -p xenterm --locked --no-default-features --features headless
      - run: cargo build -p xenterm --locked --no-default-features --features headless
      - run: python crates/xenterm/tests/config_import_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/config_export_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/cli_exec_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/access_policy_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/execution_log_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/migration_modes_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/migration_preview_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/ssh_jump_chain_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/ssh_stack_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/ssh_jump_chain_e2e.py --exe target/debug/xenterm --stage-timeouts
      - run: python crates/xenterm/tests/stdio_mcp_e2e.py --exe target/debug/xenterm
      - run: python crates/xenterm/tests/remote_mcp_e2e.py --exe target/debug/xenterm --path /mcp
      - run: python crates/xenterm/tests/remote_mcp_e2e.py --exe target/debug/xenterm --nginx /usr/sbin/nginx --path /xenterm/mcp
      - run: python crates/xenterm/tests/remote_mcp_e2e.py --exe target/debug/xenterm --nginx /usr/sbin/nginx --path /xenterm/mcp --protocol-version 2025-11-25

  windows-ssh:
    name: Windows SSH command stack
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-ssh-stack
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography paramiko
      - run: cargo test -p xenterm --locked --no-default-features --features headless command_stack_tests
      - run: cargo build -p xenterm --locked --no-default-features --features headless
      - run: python crates/xenterm/tests/ssh_stack_e2e.py --exe target/debug/xenterm.exe
      - run: python crates/xenterm/tests/migration_modes_e2e.py --exe target/debug/xenterm.exe
      - run: python crates/xenterm/tests/migration_preview_e2e.py --exe target/debug/xenterm.exe

  # The release tarball ships assets/install-linux.sh. This suite installs a
  # fake bundle into a temporary HOME/prefix and checks layout, wrapper
  # forwarding, PATH/desktop integration, upgrades and manifest-verified
  # uninstall. Stubbed sudo/xdg/cache tools keep it hermetic.
  linux-installer:
    name: Linux installer (bundle + manifest)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check installer syntax
        run: bash -n assets/install-linux.sh
      - name: Run isolated installer tests
        run: python3 tests/install_linux_test.py

  # The release workflow builds the MSI for real; this job keeps the toolchain
  # pin, the WiX sources and the packaging script honest on every change.
  # It installs a synthetic bundle so it costs about a minute, not a Flutter
  # build, and exercises the parts that only a runner (admin) can test:
  # silent install, major upgrade, Start Menu shortcut, ARP entry, uninstall.
  windows-installer:
    name: Windows MSI packaging smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned WiX Toolset 3.14.1
        shell: pwsh
        run: |
          $wix = & "$env:GITHUB_WORKSPACE\scripts\install-wix.ps1"
          if ([string]::IsNullOrWhiteSpace($wix) -or -not (Test-Path -LiteralPath (Join-Path $wix "candle.exe"))) {
            throw "scripts/install-wix.ps1 did not return a usable WiX bin directory: '$wix'"
          }
          $banner = & (Join-Path $wix "candle.exe") -? 2>&1 | Select-Object -First 1
          if ($banner -notmatch "version 3\.14\.1") { throw "unexpected WiX version: $banner" }
          Write-Host "WiX: $banner"
          "WIX_BIN=$wix" >> $env:GITHUB_ENV
      - name: Create a synthetic Windows bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "synthetic-bundle"
          New-Item -ItemType Directory -Path (Join-Path $bundle "data\flutter_assets") -Force | Out-Null
          foreach ($relative in @("xenterm.exe", "xenterm_bridge.dll", "data\app.so", "data\flutter_assets\AssetManifest.bin")) {
            Set-Content -Path (Join-Path $bundle $relative) -Value "synthetic $relative" -NoNewline
          }
          "FAKE_BUNDLE=$bundle" >> $env:GITHUB_ENV
      - name: Build an upgrade pair of MSIs
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "dist"
          $installer = "$env:GITHUB_WORKSPACE\apps\xenterm\tool\package_windows_installer.ps1"
          # Hashtable splatting binds named parameters; an array of alternating
          # names/values would be passed positionally instead.
          $common = @{
            BundleDir = $env:FAKE_BUNDLE
            WixBin = $env:WIX_BIN
            OutputDir = $dist
          }
          $msi1 = & $installer -Version v0.0.1 @common
          $msi2 = & $installer -Version v0.0.2 @common
          foreach ($msi in @($msi1, $msi2)) {
            if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) { throw "missing MSI: $msi" }
          }
          "MSI_V1=$msi1" >> $env:GITHUB_ENV
          "MSI_V2=$msi2" >> $env:GITHUB_ENV
      - name: Silent install, major upgrade and silent uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:ProgramFiles "XenTerm"
          $shortcut = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\XenTerm\XenTerm.lnk"
          # Per-machine install: DesktopFolder resolves to the shared desktop.
          $desktopShortcut = Join-Path $env:PUBLIC "Desktop\XenTerm.lnk"

          function Get-ArpEntry {
            Get-ItemProperty @(
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
            ) -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq "XenTerm" }
          }
          function Invoke-Msi {
            param([string[]] $MsiArgs, [string] $LogName)
            $log = Join-Path $env:RUNNER_TEMP $LogName
            $arguments = $MsiArgs + @("/l*v", "`"$log`"")
            $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath $log -Tail 80 | Write-Host
              throw "msiexec failed with exit code $($process.ExitCode) (log: $log)"
            }
          }

          if (Test-Path -LiteralPath $installDir) { throw "unexpected pre-existing $installDir" }

          Write-Host "Installing 0.0.1 silently"
          Invoke-Msi -MsiArgs @("/i", "`"$env:MSI_V1`"", "/qn", "/norestart") -LogName "install-1.log"
          if (-not (Test-Path -LiteralPath (Join-Path $installDir "xenterm.exe"))) { throw "installed xenterm.exe is missing" }
          if (-not (Test-Path -LiteralPath $shortcut)) { throw "Start Menu shortcut is missing" }
          if (-not (Test-Path -LiteralPath $desktopShortcut)) { throw "Desktop shortcut is missing" }
          $entry = @(Get-ArpEntry)
          if ($entry.Count -ne 1) { throw "expected one ARP entry after install, got $($entry.Count)" }
          if ($entry[0].DisplayVersion -ne "0.0.1") { throw "DisplayVersion is $($entry[0].DisplayVersion), expected 0.0.1" }

          Write-Host "Upgrading to 0.0.2 silently (major upgrade)"
          Invoke-Msi -MsiArgs @("/i", "`"$env:MSI_V2`"", "/qn", "/norestart") -LogName "install-2.log"
          $entry = @(Get-ArpEntry)
          if ($entry.Count -ne 1) { throw "expected one ARP entry after upgrade, got $($entry.Count) (stale product not removed)" }
          if ($entry[0].DisplayVersion -ne "0.0.2") { throw "DisplayVersion is $($entry[0].DisplayVersion), expected 0.0.2 after upgrade" }

          Write-Host "Uninstalling silently"
          Invoke-Msi -MsiArgs @("/x", "`"$env:MSI_V2`"", "/qn", "/norestart") -LogName "uninstall.log"
          if (Test-Path -LiteralPath $installDir) { throw "install directory survived uninstall: $installDir" }
          if (Test-Path -LiteralPath $shortcut) { throw "Start Menu shortcut survived uninstall" }
          if (Test-Path -LiteralPath $desktopShortcut) { throw "Desktop shortcut survived uninstall" }
          $entry = @(Get-ArpEntry)
          if ($entry.Count -ne 0) { throw "ARP entry survived uninstall" }
