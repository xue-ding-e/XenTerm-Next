# Dependency updates. Locks are committed on purpose:
#   - Cargo.lock keeps release builds and the security-motivated pins reproducible
#   - apps/xenterm/pubspec.lock is what the Flutter CI and release workflow use
# Keep this file in sync with the toolchain versions pinned in CI
# (Flutter `3.47.7`, Rust `stable`); a dependency bump is only verified by CI.
#
# Major-version bumps are ignored: the Rust dependencies carry security- and
# toolchain-driven pins, so majors need a deliberate, reviewed migration rather
# than an automatic PR. Minor/patch updates arrive as one grouped PR per
# ecosystem; Dependabot security updates are unaffected by the limit below.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      rust-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Deliberately pinned for RUSTSEC-2026-0154 and the ring crypto backend;
      # these need a reviewed migration rather than an automatic update run.
      - dependency-name: "russh"
      - dependency-name: "russh-sftp"

  - package-ecosystem: pub
    directory: "/apps/xenterm"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      flutter-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
