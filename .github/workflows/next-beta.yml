name: XenTerm Next beta

# Only a successful CI run on this repository's maintained main may provide
# source code. workflow_run's GITHUB_SHA is NOT the tested source SHA.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# All generations share a lock. FIFO is not promised, so freshness is checked
# again immediately before writes. Do not cancel an active asset upload.
concurrency:
  group: next-beta-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.repository == 'xue-ding-e/XenTerm-Next' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      ci_run: ${{ steps.verify.outputs.ci_run }}
    steps:
      # No source checkout or artifact execution before verifying the CI identity.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: verify
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: context.payload.workflow_run.id});
            const {data: main} = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            if (run.repository.full_name !== 'xue-ding-e/XenTerm-Next' ||
                run.head_repository.full_name !== run.repository.full_name ||
                run.path !== '.github/workflows/ci.yml' || run.head_branch !== 'main' ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                run.status !== 'completed' || run.conclusion !== 'success' ||
                !/^[0-9a-f]{40}$/.test(run.head_sha) || run.head_sha !== main.object.sha) {
              throw new Error('Only the current main SHA with its own successful CI may release');
            }
            core.setOutput('sha', run.head_sha);
            core.setOutput('ci_run', String(run.id));

  build:
    needs: gate
    uses: ./.github/workflows/next-beta-build.yml
    with:
      source_sha: ${{ needs.gate.outputs.sha }}
      ci_run: ${{ needs.gate.outputs.ci_run }}

  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
      CI_RUN_ID: ${{ needs.gate.outputs.ci_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: next-*
          merge-multiple: true
          path: dist
      - name: Verify, upload, promote beta, then clean only managed old assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/next_beta.py
