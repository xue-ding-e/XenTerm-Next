name: Next Flutter SFTP action state red-green (Dart only)
on:
  push:
    branches: [validation/flutter-sftp-action-state-20261105]
permissions:
  contents: read
concurrency:
  group: next-product-heavy
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/validation/flutter-sftp-action-state-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c0d371e4730b83a81ece806cbb42d216eb9d874d
          path: source
          persist-credentials: false
      - name: Verify controller contracts before SDK setup
        run: python3 -m unittest discover -s control/scripts/next -p test_sftp_action_state_gate.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Synthetic SFTP state red then green with locked dependencies
        timeout-minutes: 20
        run: python3 control/scripts/next/run_sftp_action_state_gate.py --source source --logs evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sftp-action-state-c0d371e4-${{ github.run_attempt }}-${{ job.status }}
          path: evidence/*
          if-no-files-found: error
          retention-days: 14
