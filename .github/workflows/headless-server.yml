name: Build verified headless server (Ubuntu 22.04)
on:
  push:
    branches: [build/headless-issue1-20261014]
    paths:
      - .github/workflows/headless-server.yml
      - scripts/headless_server_package.py
      - tests/test_headless_server_package.py
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: github.repository == 'xue-ding-e/XenTerm-Next'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: 2c8da5b8486c9865a5d769766f5051bcf4998571
      CI_RUN_ID: '38629573194'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Verify immutable source CI before checkout
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: process.env.CI_RUN_ID});
            if (run.repository.full_name !== context.repo.owner + '/' + context.repo.repo ||
                run.head_repository.full_name !== run.repository.full_name ||
                run.head_sha !== process.env.SOURCE_SHA || run.head_branch !== 'main' ||
                run.path !== '.github/workflows/ci.yml' || run.event !== 'push' ||
                run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('Source must have its own successful main CI');
            }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Test packaging validation
        run: python3 -m unittest discover -s tooling/tests -p test_headless_server_package.py -v
      - name: Build fixed source without desktop dependencies
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo build --locked --release --no-default-features --features headless
      - name: Test actual release binary stdio access policy
        working-directory: source
        run: |
          python3 -m pip install 'mcp>=2.3,<3'
          python3 tests/access_policy_e2e.py --exe target/release/xenterm
      - name: Validate ELF ABI and package with provenance
        run: python3 tooling/scripts/headless_server_package.py source dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: headless-linux-x86_64-2c8da5b
          path: dist/*
          if-no-files-found: error
          retention-days: 14
