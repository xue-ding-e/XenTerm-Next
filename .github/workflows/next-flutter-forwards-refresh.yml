name: Next Flutter forwards refresh red-green (Dart only)
on:
  push:
    branches: [validation/flutter-forwards-refresh-20261105]
permissions:
  contents: read
concurrency:
  group: next-product-heavy
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/validation/flutter-forwards-refresh-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 12f482827c3961c1d83c8c5aa5ae96e44646f9eb
          path: source
          persist-credentials: false
      - name: Verify controller contracts before SDK setup
        run: python3 -m unittest discover -s control/scripts/next -p test_forwards_refresh_gate.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Synthetic refresh red then green with locked dependencies
        timeout-minutes: 20
        run: python3 control/scripts/next/run_forwards_refresh_gate.py --source source --logs evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forwards-refresh-12f48282-${{ github.run_attempt }}-${{ job.status }}
          path: evidence/*
          if-no-files-found: error
          retention-days: 14
