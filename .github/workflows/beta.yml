name: Beta Release

# Rolling pre-release build: every push to any branch builds all platforms and
# publishes them to a single rolling "beta" Release marked as a pre-release.
# The previous beta release is deleted first, so the release list keeps
# exactly one pre-release at all times. Tag pushes are handled by release.yml
# and are excluded here (a branches filter makes this workflow ignore tags).
#
# The artifact set mirrors release.yml one-for-one — same platforms, same
# AppImage / .deb / MSI / Flatpak / glibc-2.28 tarballs — so a beta carries the
# same formats and the same files inside each package as a tagged release.
# Only the version strings differ (beta-<sha7> instead of vX.Y.Z).

on:
  push:
    branches: ["**"]

permissions:
  contents: write   # needed to delete / create the beta Release

# One beta build at a time; a newer push cancels the older run.
concurrency:
  group: beta-release
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            bin: xenterm.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            bin: xenterm
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            bin: xenterm
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-aarch64
            bin: xenterm
          - os: macos-14
            target: x86_64-apple-darwin
            name: macos-x86_64
            bin: xenterm

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: beta-${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="beta-${GITHUB_SHA::7}"
          STAGE="xenterm-${VERSION}-${{ matrix.name }}"

          if [ "${{ runner.os }}" = "macOS" ]; then
            APP="xenterm.app"
            CONTENTS="$APP/Contents"
            mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"
            cp "target/${{ matrix.target }}/release/xenterm" "$CONTENTS/MacOS/"
            cp THIRD_PARTY_NOTICES.md "$CONTENTS/Resources/"
            mkdir -p xenterm.iconset
            sips -z 16  16  "assets/icon@512.png" --out xenterm.iconset/icon_16x16.png      >/dev/null
            sips -z 32  32  "assets/icon@512.png" --out xenterm.iconset/icon_16x16@2x.png   >/dev/null
            sips -z 32  32  "assets/icon@512.png" --out xenterm.iconset/icon_32x32.png       >/dev/null
            sips -z 64  64  "assets/icon@512.png" --out xenterm.iconset/icon_32x32@2x.png    >/dev/null
            sips -z 128 128 "assets/icon@512.png" --out xenterm.iconset/icon_128x128.png     >/dev/null
            sips -z 256 256 "assets/icon@512.png" --out xenterm.iconset/icon_128x128@2x.png  >/dev/null
            sips -z 256 256 "assets/icon@512.png" --out xenterm.iconset/icon_256x256.png     >/dev/null
            sips -z 512 512 "assets/icon@512.png" --out xenterm.iconset/icon_256x256@2x.png  >/dev/null
            sips -z 512 512 "assets/icon@512.png" --out xenterm.iconset/icon_512x512.png     >/dev/null
            iconutil -c icns xenterm.iconset -o "$CONTENTS/Resources/xenterm.icns"
            VERSION_NUM="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
            sed "s/__VERSION__/${VERSION_NUM}-beta/g" assets/Info.plist > "$CONTENTS/Info.plist"
            codesign --force --deep --sign - "$APP"
            codesign --verify --verbose "$APP"
            ditto -c -k --keepParent "$APP" "${STAGE}.zip"
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            cp README.md README.zh.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
            7z a "${STAGE}.zip" "$STAGE" >/dev/null
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"
          else
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            cp README.md README.zh.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
            cp assets/xenterm.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
            tar -czf "${STAGE}.tar.gz" "$STAGE"
            echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi

      # Same extra formats as release.yml, so a beta is a drop-in preview of a
      # tagged release. AppImage/MSI stay best-effort exactly as in release.
      - name: Build AppImage
        if: matrix.name == 'linux-x86_64'
        continue-on-error: true           # don't block the .tar.gz if AppImage fails
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # no FUSE needed in CI
        run: |
          set -eu
          VERSION="beta-${GITHUB_SHA::7}"
          wget -q -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-appimage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-appimage

          install -Dm755 target/${{ matrix.target }}/release/xenterm AppDir/usr/bin/xenterm
          install -Dm644 assets/xenterm.desktop          AppDir/usr/share/applications/xenterm.desktop
          install -Dm644 assets/icon@512.png               AppDir/usr/share/icons/hicolor/512x512/apps/xenterm.png

          # --output appimage already invokes the plugin; --plugin appimage is redundant and causes an error
          ./linuxdeploy --appdir AppDir --output appimage

          mv xenterm*.AppImage "xenterm-${VERSION}-linux-x86_64.AppImage"
          echo "APPIMAGE=xenterm-${VERSION}-linux-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Build Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          VERSION="beta-${GITHUB_SHA::7}"
          # Unlike a tag ("v0.7.3"), "beta-<sha>" is not a valid Debian upstream
          # version (it must start with a digit), so derive one from Cargo.toml:
          # 0.7.3~beta.<sha7> sorts *before* the 0.7.3 release, which is what a
          # pre-release should do.
          PKG_VERSION="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$PKG_VERSION"
          VERSION_NUM="${PKG_VERSION}~beta.${GITHUB_SHA::7}"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) DEB_ARCH=amd64 ;;
            aarch64-unknown-linux-gnu) DEB_ARCH=arm64 ;;
            *) echo "Unsupported Debian architecture: ${{ matrix.target }}"; exit 1 ;;
          esac

          ROOT="deb-root"
          install -Dm755 "target/${{ matrix.target }}/release/xenterm" "$ROOT/usr/bin/xenterm"
          install -Dm644 assets/xenterm.desktop "$ROOT/usr/share/applications/xenterm.desktop"
          install -Dm644 assets/icon@512.png "$ROOT/usr/share/icons/hicolor/512x512/apps/xenterm.png"
          install -Dm644 THIRD_PARTY_NOTICES.md "$ROOT/usr/share/doc/xenterm/THIRD_PARTY_NOTICES.md"
          install -d "$ROOT/DEBIAN"

          # dpkg-shlibdeps expects source-package metadata in debian/control,
          # even when -O prints the generated dependency variable to stdout.
          # Without this file it exits with code 25 on both Linux runners.
          install -d debian
          cat > debian/control <<'EOF'
          Source: xenterm
          Section: net
          Priority: optional
          Maintainer: XenTerm contributors
          Standards-Version: 4.6.2

          Package: xenterm
          Architecture: any
          Depends: ${shlibs:Depends}
          Description: Lightweight SSH, SFTP, and terminal client
          EOF
          DEPENDS="$(dpkg-shlibdeps -O -e"$ROOT/usr/bin/xenterm" | sed -n 's/^shlibs:Depends=//p')"
          test -n "$DEPENDS"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: xenterm
          Version: ${VERSION_NUM}
          Section: net
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: XenTerm contributors
          Depends: ${DEPENDS}
          Homepage: https://github.com/ixbaicn/XenTerm
          Description: Lightweight SSH, SFTP, and terminal client
           XenTerm is a cross-platform terminal client written in Rust and GPUI.
          EOF

          DEB="xenterm-${VERSION}-linux-${DEB_ARCH}.deb"
          dpkg-deb --root-owner-group --build "$ROOT" "$DEB"
          dpkg-deb --info "$DEB"
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      # MSI installer with a "choose install location" wizard (WixUI_InstallDir).
      # Best-effort, exactly like release.yml: if the WiX/cargo-wix tooling
      # hiccups it must not block the .zip release, hence continue-on-error.
      # The MSI's Product/@Version comes from Cargo.toml via cargo-wix, so the
      # packaged version is the crate version rather than beta-<sha>.
      - name: Build MSI installer (Windows)
        if: matrix.name == 'windows-x86_64'
        continue-on-error: true
        shell: pwsh
        run: |
          $VERSION = "beta-$($env:GITHUB_SHA.Substring(0,7))"
          # WiX 3 toolset (candle/light) that cargo-wix drives.
          choco install wixtoolset -y --no-progress
          $candle = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($candle) { $env:PATH = "$($candle.DirectoryName);$env:PATH" }
          cargo install cargo-wix --locked
          cargo wix --no-build --nocapture --target ${{ matrix.target }} --output "xenterm-$VERSION-windows-x86_64.msi"
          echo "MSI=xenterm-$VERSION-windows-x86_64.msi" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.name }}
          path: ${{ env.ASSET }}

      - name: Upload AppImage artifact
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: beta-linux-x86_64-appimage
          path: ${{ env.APPIMAGE }}

      - name: Upload Debian package artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.name }}-deb
          path: ${{ env.DEB }}

      - name: Upload MSI artifact
        if: matrix.name == 'windows-x86_64' && env.MSI != ''
        uses: actions/upload-artifact@v4
        with:
          name: beta-windows-x86_64-msi
          path: ${{ env.MSI }}

  build-flatpak:
    name: beta-linux-x86_64-flatpak
    needs: [build]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Compute beta version
        shell: bash
        run: echo "BETA_VERSION=beta-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Download Linux x86_64 package
        uses: actions/download-artifact@v4
        with:
          name: beta-linux-x86_64
          path: dist

      - name: Restore prebuilt binary for Flatpak manifest
        shell: bash
        run: |
          set -eu
          tar -xzf dist/*.tar.gz -C dist
          BINARY="$(find dist -type f -name xenterm -perm -111 -print -quit)"
          test -n "$BINARY"
          install -Dm755 "$BINARY" target/x86_64-unknown-linux-gnu/release/xenterm

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: xenterm-${{ env.BETA_VERSION }}-linux-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.yituorou.xenterm.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-linux-x86_64-flatpak
          path: xenterm-${{ env.BETA_VERSION }}-linux-x86_64.flatpak

  build-linux-aarch64-glibc228:
    name: beta-linux-aarch64-glibc228
    runs-on: ubuntu-22.04-arm
    container: debian:10

    steps:
      - name: Prepare Debian 10 build dependencies
        shell: bash
        run: |
          set -eu
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99archive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils file tar \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: beta-aarch64-unknown-linux-gnu-glibc228

      - name: Build (release)
        shell: bash
        run: |
          set -eu
          . "$HOME/.cargo/env"
          rustc --version
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Verify glibc baseline
        shell: bash
        run: |
          set -eu
          ldd --version | sed -n '1p'
          file target/aarch64-unknown-linux-gnu/release/xenterm
          objdump -T target/aarch64-unknown-linux-gnu/release/xenterm \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -n 10 || true

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="beta-${GITHUB_SHA::7}"
          STAGE="xenterm-${VERSION}-linux-aarch64-glibc228"

          mkdir "$STAGE"
          cp "target/aarch64-unknown-linux-gnu/release/xenterm" "$STAGE/"
          cp README.md README.zh.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
          cp assets/xenterm.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-linux-aarch64-glibc228
          path: ${{ env.ASSET }}

  build-linux-x86_64-glibc228:
    name: beta-linux-x86_64-glibc228
    runs-on: ubuntu-22.04
    container: debian:10

    steps:
      - name: Prepare Debian 10 build dependencies
        shell: bash
        run: |
          set -eu
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99archive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils file tar \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: beta-x86_64-unknown-linux-gnu-glibc228

      - name: Build (release)
        shell: bash
        run: |
          set -eu
          . "$HOME/.cargo/env"
          rustc --version
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Verify glibc baseline
        shell: bash
        run: |
          set -eu
          ldd --version | sed -n '1p'
          file target/x86_64-unknown-linux-gnu/release/xenterm
          objdump -T target/x86_64-unknown-linux-gnu/release/xenterm \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -n 10 || true

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="beta-${GITHUB_SHA::7}"
          STAGE="xenterm-${VERSION}-linux-x86_64-glibc228"

          mkdir "$STAGE"
          cp "target/x86_64-unknown-linux-gnu/release/xenterm" "$STAGE/"
          cp README.md README.zh.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
          cp assets/xenterm.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-linux-x86_64-glibc228
          path: ${{ env.ASSET }}

  publish:
    name: Publish rolling beta release
    needs: [build, build-flatpak, build-linux-aarch64-glibc228, build-linux-x86_64-glibc228]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: beta-*
          path: dist
          merge-multiple: true

      - name: Delete previous beta release (keep exactly one pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Drop the rolling beta release/tag...
          gh release delete beta --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          # ...and any other stray pre-releases, so at most one remains.
          gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | while read -r TAG; do
                [ "$TAG" = "beta" ] || gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
              done

      - name: Create beta pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create beta dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Beta (${SHORT_SHA})" \
            --notes "自动构建的预览版（beta），来自 commit ${SHORT_SHA}。每次代码提交都会替换此预览版，始终只保留最新一个。"
