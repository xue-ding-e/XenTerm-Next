name: Observe exact old GPUI per-user installation registration
'on':
  push:
    branches:
    - validation/gpui-msi-repack-20261102
    paths:
    - .github/workflows/gpui-msi-registration-probe.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: gpui-msi-only-${{ github.repository }}
  cancel-in-progress: false
jobs:
  registration:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
    - name: Pin prior failed run and exact retained artifact
      timeout-minutes: 3
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        script: |
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          const owner='xue-ding-e', repo='XenTerm-Next', branch='validation/gpui-msi-repack-20261102';
          const prior='8f934490008cb9abab234f188fd354e7ddd9f3c5', retained='89fd985c6275085acd2c5babbd4dadb05ec6155e', source='0d60b91691ce082137db3e3f995ef6fc8c783b83';
          const need=(v,m)=>{if(!v)throw new Error(m);};
          need(context.repo.owner===owner && context.repo.repo===repo && context.eventName==='push' && context.ref===`refs/heads/${branch}` && context.payload.before===prior, 'Wrong event/ref/before');
          const {data:ref}=await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`});
          need(ref.object.sha===context.sha,'Stale controller');
          const {data:commit}=await github.rest.git.getCommit({owner,repo,commit_sha:context.sha});
          need(commit.parents.length===1 && commit.parents[0].sha===prior,'Wrong controller parent');
          for(const who of [commit.author,commit.committer]) need(who.name==='Qing Liang' && who.email==='106448173+xue-ding-e@users.noreply.github.com','Wrong attribution');
          const {data:diff}=await github.rest.repos.compareCommits({owner,repo,base:prior,head:context.sha});
          need(diff.files.length===1 && diff.files[0].filename==='.github/workflows/gpui-msi-registration-probe.yml' && diff.files[0].status==='modified','Controller must only modify this diagnostic workflow');
          const {data:src}=await github.rest.git.getCommit({owner,repo,commit_sha:source});
          need(src.tree.sha==='007d4575d1cf9e8c057ef0906dca0cdf64015a79' && src.parents.length===1 && src.parents[0].sha==='488f001949613327150abb8f74b464278604df69','Wrong packaging source');
          const {data:run}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:41502584678});
          need(run.head_sha===retained && run.head_branch===branch && run.run_attempt===1 && run.event==='push' && run.repository.full_name===`${owner}/${repo}` && run.head_repository.full_name===`${owner}/${repo}` && run.path==='.github/workflows/gpui-msi-repack-verify.yml' && run.status==='completed' && run.conclusion==='failure','Wrong retained run');
          const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,{owner,repo,run_id:run.id,attempt_number:1,per_page:100});
          need(jobs.length===2 && jobs.every(j=>j.status==='completed' && j.head_sha===retained),'Wrong prior jobs');
          need(jobs.find(j=>j.name==='source-proof')?.conclusion==='success','Prior proof failed');
          const native=jobs.find(j=>j.name==='real-windows-msi');
          need(native?.conclusion==='failure','Wrong native state');
          need(JSON.stringify(native.steps.filter(s=>s.conclusion==='failure').map(s=>s.name))===JSON.stringify(['Verify real old-to-current GPUI MSI lifecycle']),'Unexpected prior failing steps');
          for(const name of ['Verify synthetic profile preservation contracts','Verify exact archive and payload identity before safe extraction','Reject unpackaged Microsoft runtime dependencies in actual PE','Keep real GPUI MSI and lifecycle evidence (not a release)']) need(native.steps.find(s=>s.name===name)?.conclusion==='success','Missing prior evidence');
          const args={owner,repo,artifact_id:13169117796};
          const {data:meta}=await github.rest.actions.getArtifact(args);
          const digest='9129458976c5b1c9d2d5bf829a0ae0b4d4e78b8771f6557a11746c65808bd4a9';
          need(!meta.expired && meta.size_in_bytes===115615510 && meta.digest===`sha256:${digest}` && meta.name===`gpui-msi-repack-${source}` && meta.workflow_run.id===run.id && meta.workflow_run.head_sha===retained,'Wrong retained artifact');
          const {data}=await github.rest.actions.downloadArtifact({...args,archive_format:'zip'});
          const bytes=Buffer.from(data);
          need(bytes.length===115615510 && crypto.createHash('sha256').update(bytes).digest('hex')===digest,'Artifact bytes differ');
          const dir=path.join(process.env.RUNNER_TEMP,'gpui-registration-input');
          fs.mkdirSync(dir);
          fs.writeFileSync(path.join(dir,'input.zip'),bytes,{flag:'wx'});
    - name: Extract only exact old 8819 MSI
      timeout-minutes: 1
      shell: python
      run: |
        import hashlib, os, zipfile, stat
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'gpui-registration-input'
        raw=(root/'input.zip').read_bytes()
        assert len(raw)==115615510 and hashlib.sha256(raw).hexdigest()=='9129458976c5b1c9d2d5bf829a0ae0b4d4e78b8771f6557a11746c65808bd4a9'
        expected={'_temp/gpui-real-prior.msi':'8b14daacda30f49d54a4bdce6ae0af439e48a8097a0b7077dc4d619b0719057c'}
        with zipfile.ZipFile(root/'input.zip') as z:
            names=z.namelist()
            for i,(name,digest) in enumerate(expected.items()):
                assert names.count(name)==1
                e=z.getinfo(name)
                assert not e.is_dir() and not e.flag_bits & 1 and not stat.S_ISLNK(e.external_attr >> 16)
                assert 0 < e.file_size < 100000000
                data=z.read(e)
                assert hashlib.sha256(data).hexdigest()==digest
                with (root/f'input-{i}.msi').open('xb') as f: f.write(data)
        # No other ZIP entry is extracted; no source/executable is run.
    - name: Observe one isolated installation and always uninstall exact product
      timeout-minutes: 5
      shell: pwsh
      run: |
        $script=Join-Path $env:RUNNER_TEMP 'gpui-registration-probe.ps1'
        if(Test-Path -LiteralPath $script){throw 'Refusing existing probe file'}
        $content=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
        [IO.File]::WriteAllText($script,$content,[Text.UTF8Encoding]::new($false))
        & { param($Script)
        Set-StrictMode -Version Latest
        $ErrorActionPreference='Stop'
        $tokens=$null;$errors=$null
        $ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $Script).Path,[ref]$tokens,[ref]$errors)
        if($errors.Count -ne 0){throw 'Probe parse errors'}
        $functions=@($ast.FindAll({param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Assert-EmptyFamily'},$true))
        if($functions.Count -ne 1){throw 'Expected exactly one family guard'}
        . ([scriptblock]::Create($functions[0].Extent.Text))
        $passed=0
        function Reject([scriptblock]$case){$rejected=$false;try{& $case}catch{$rejected=$true};if(-not $rejected){throw 'Unsafe family evidence accepted'}}
        # Observed COM adapter .Count was null, but explicit dispatch Count was int 0.
        $adapter=[pscustomobject]@{Count=$null;DispatchCount=[int]0;Items=@()}
        if(-not ($adapter.Count -ne 0)){throw 'Old expression negative control unexpectedly changed'}
        Assert-EmptyFamily $adapter.DispatchCount $adapter.Items ([uint32]259) ''; $passed++
        Reject {Assert-EmptyFamily $null @() ([uint32]259) ''};$passed++
        Reject {Assert-EmptyFamily '0' @() ([uint32]259) ''};$passed++
        Reject {Assert-EmptyFamily -1 @() ([uint32]259) ''};$passed++
        Reject {Assert-EmptyFamily 0 $null ([uint32]259) ''};$passed++
        Reject {Assert-EmptyFamily 1 @('{5FE800A9-0163-42ED-822A-34D78D542EEC}') ([uint32]0) '{5FE800A9-0163-42ED-822A-34D78D542EEC}'};$passed++
        Reject {Assert-EmptyFamily 0 @('unexpected') ([uint32]259) ''};$passed++
        Reject {Assert-EmptyFamily 0 @() ([uint32]0) '{5FE800A9-0163-42ED-822A-34D78D542EEC}'};$passed++
        Reject {Assert-EmptyFamily 0 @() ([uint32]1603) ''};$passed++
        Reject {Assert-EmptyFamily 0 @() ([uint32]259) 'unexpected'};$passed++
        Reject {Assert-EmptyFamily 0 @() $null ''};$passed++
        Reject {Assert-EmptyFamily 0 @() 259 ''};$passed++
        if($passed -ne 12){throw 'Missing guard tests'}
        Write-Output "Family guard regression passed: $passed"

        } $script
        & { param($Script)
        Set-StrictMode -Version Latest
        $ErrorActionPreference='Stop'
        $tokens=$null;$errors=$null
        $ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $Script).Path,[ref]$tokens,[ref]$errors)
        if($errors.Count){throw 'Probe parse errors'}
        $definitions=@($ast.FindAll({param($n) $n -is [Management.Automation.Language.StringConstantExpressionAst] -and $n.Value.Contains('public static class GPUIRegistrationApi')},$true))
        if($definitions.Count -ne 1){throw 'Expected one native wrapper definition'}
        $source=$definitions[0].Value.Replace('GPUIRegistrationApi','GPUIRegistrationApiContract')
        # Replace only native imports with capture stubs: exercise the actual C# wrapper/argument selection without Windows Installer calls.
        $enum='(?s)\[DllImport\("msi.dll",CharSet=CharSet.Unicode,ExactSpelling=true\)\]\s+private static extern uint MsiEnumProductsExW\([^;]+;'
        $prop='(?s)\[DllImport\("msi.dll",CharSet=CharSet.Unicode,ExactSpelling=true\)\]\s+private static extern uint MsiGetProductInfoExW\([^;]+;'
        if([regex]::Matches($source,$enum).Count -ne 1 -or [regex]::Matches($source,$prop).Count -ne 1){throw 'Unexpected native import definitions'}
        $source=[regex]::Replace($source,$enum,@'
        public static string CapturedSid; public static uint CapturedContext; public static string CapturedCode; public static string CapturedProperty;
        private static uint MsiEnumProductsExW(string code,string sid,uint context,uint index,StringBuilder foundCode,out uint foundContext,StringBuilder foundSid,ref uint sidLength) {CapturedSid=sid;CapturedContext=context;CapturedCode=code;foundContext=0;return 259;}
        '@)
        $source=[regex]::Replace($source,$prop,@'
        private static uint MsiGetProductInfoExW(string code,string sid,uint context,string property,StringBuilder value,ref uint length) {CapturedSid=sid;CapturedContext=context;CapturedCode=code;CapturedProperty=property;return 0;}
        '@)
        Add-Type -TypeDefinition $source
        $code='{5FE800A9-0163-42ED-822A-34D78D542EEC}';$sid='S-1-5-21-1-2-3-500'
        $found=[Text.StringBuilder]::new(39);$user=[Text.StringBuilder]::new(256);[uint32]$size=256;[uint32]$context=0
        $r=[GPUIRegistrationApiContract]::Enumerate($code,'',4,0,$found,[ref]$context,$user,[ref]$size)
        if($r -ne 259 -or $null -ne [GPUIRegistrationApiContract]::CapturedSid -or [GPUIRegistrationApiContract]::CapturedContext -ne 4 -or [GPUIRegistrationApiContract]::CapturedCode -cne $code){throw 'Machine enumeration lost native NULL or exact scope'}
        $r=[GPUIRegistrationApiContract]::Enumerate($code,$sid,3,0,$found,[ref]$context,$user,[ref]$size)
        if([GPUIRegistrationApiContract]::CapturedSid -cne $sid -or [GPUIRegistrationApiContract]::CapturedContext -ne 3){throw 'Current-user enumeration changed scope'}
        $r=[GPUIRegistrationApiContract]::Property($code,'',4,'State',$user,[ref]$size)
        if($null -ne [GPUIRegistrationApiContract]::CapturedSid -or [GPUIRegistrationApiContract]::CapturedProperty -cne 'State'){throw 'Machine property lost native NULL'}
        foreach($scope in @(1,2)){$r=[GPUIRegistrationApiContract]::Property($code,$sid,$scope,'State',$user,[ref]$size);if([GPUIRegistrationApiContract]::CapturedSid -cne $sid -or [GPUIRegistrationApiContract]::CapturedContext -ne $scope){throw 'Per-user property changed scope'}}
        foreach($case in @(@(7,$sid),@(3,''))){$rejected=$false;try{[void][GPUIRegistrationApiContract]::SidForContext($case[0],$case[1])}catch{$rejected=$true};if(-not $rejected){throw 'Invalid scope or missing SID accepted'}}
        Write-Output 'Native parameter capture regression passed: 7'

        } $script
        & $script -Msi (Join-Path $env:RUNNER_TEMP 'gpui-registration-input/input-0.msi')
    - name: Keep registration and cleanup evidence (not acceptance or release)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gpui-msi-registration-observation
        path: |-
          ${{ runner.temp }}/gpui-registration-observation/registration.json
          ${{ runner.temp }}/gpui-registration-observation/*.log
        if-no-files-found: warn
        retention-days: 7
