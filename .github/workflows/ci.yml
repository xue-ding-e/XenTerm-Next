name: GPUI UTF-8 wiring supplement (manual, no release)

# This supplements existing Rust evidence; it does not rerun Rust or native Dock events.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-wiring-utf8-supplement-${{ github.repository }}
  cancel-in-progress: false

jobs:
  wiring:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/validation/gpui-wiring-utf8-20261028'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    steps:
      - name: Check out this validation control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          sparse-checkout: scripts/gpui_wiring_utf8_validation.py
          sparse-checkout-cone-mode: false
      - name: Check out immutable product source and its single parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 43769a2d014ea15e5e52e7e11830c143bc873b1a
          path: source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify exact delta, prior run identity, five wiring tests and encoding red-green
        run: python control/scripts/gpui_wiring_utf8_validation.py source
