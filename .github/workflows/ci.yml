name: CI

# Consolidated push/PR gate (formerly desktop-check.yml, profile-consistency.yml,
# remote-mcp.yml and installer-check.yml):
#   - desktop: compile + isolated GUI tests on all three OSes
#   - headless-e2e: headless unit tests + Python end-to-end regressions
#   - migration-e2e: isolated migration CLI regressions on all three OSes
#   - installer: Linux install-script syntax + regressions
# Release packaging lives in release.yml.

on:
  push:
    paths: ["Cargo.toml", "Cargo.lock", "build.rs", "src/**", "tests/*_e2e.py", "tests/tls_proxy_fixture.py", "assets/install-linux.sh", "tests/install_linux_test.py", "wix/**", "packaging/macos/**", "tests/windows_installer*", "tests/macos_installer*", "tests/release_workflow_test.py", ".github/workflows/ci.yml", ".github/workflows/release.yml", ".github/workflows/next-beta.yml", ".github/workflows/next-beta-build.yml", "scripts/next_beta*.py", "tests/next_beta*.py"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "build.rs", "src/**", "tests/*_e2e.py", "tests/tls_proxy_fixture.py", "assets/install-linux.sh", "tests/install_linux_test.py", "wix/**", "packaging/macos/**", "tests/windows_installer*", "tests/macos_installer*", "tests/release_workflow_test.py", ".github/workflows/ci.yml", ".github/workflows/release.yml", ".github/workflows/next-beta.yml", ".github/workflows/next-beta-build.yml", "scripts/next_beta*.py", "tests/next_beta*.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: Linux desktop }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: Windows desktop }
          - { os: macos-14, target: aarch64-apple-darwin, name: macOS desktop }
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-check-${{ matrix.target }}
      # Keep the upstream stable/MSVC Windows configuration. Debug checking
      # avoids the release-only fxc.exe shader compilation and package tooling.
      - run: cargo check --locked --target ${{ matrix.target }} --jobs 2
      # Separate invocations so PowerShell cannot hide a failing first command
      # behind the second native command's successful exit status.
      - name: Test session editor interactions
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xenterm-gui-config
          XDG_DATA_HOME: ${{ runner.temp }}/xenterm-gui-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xenterm-gui-runtime
        run: cargo test --locked --target ${{ matrix.target }} --jobs 2 ui::session_editor::tests
      - name: Test native dialog interactions
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xenterm-gui-config
          XDG_DATA_HOME: ${{ runner.temp }}/xenterm-gui-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xenterm-gui-runtime
        run: cargo test --locked --target ${{ matrix.target }} --jobs 2 ui::dialog_parity_tests
      # Keep Enter/IME and dialog dismissal regressions on every desktop OS;
      # this reuses the test binary above rather than adding another runner.
      - name: Test group rename and dismissal interactions
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xenterm-group-config
          XDG_DATA_HOME: ${{ runner.temp }}/xenterm-group-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xenterm-group-runtime
        run: cargo test --locked --target ${{ matrix.target }} --jobs 2 ui::shell::group_dialog_tests -- --test-threads=1
      - name: Test execution history settings, viewer and revocation
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xenterm-history-config
          XDG_DATA_HOME: ${{ runner.temp }}/xenterm-history-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xenterm-history-runtime
        run: cargo test --locked --target ${{ matrix.target }} --jobs 2 execution_log -- --test-threads=1
      # Run the GUI export policy against each platform's private publisher.
      # Linux's full suite also covers it; Windows/macOS need this explicit
      # filter because their remaining desktop steps run narrower subsets.
      - name: Test private GUI export policy
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xenterm-export-config
          XDG_DATA_HOME: ${{ runner.temp }}/xenterm-export-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xenterm-export-runtime
        run: cargo test --locked --target ${{ matrix.target }} --jobs 2 ui::shell::file_dialog_tests::gui_export_ -- --test-threads=1
      - name: Test complete desktop regression suite on Linux
        if: runner.os == 'Linux'
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xenterm-full-config
          XDG_DATA_HOME: ${{ runner.temp }}/xenterm-full-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xenterm-full-runtime
        # Include this PR's regressions and the tests merged from upstream.
        run: cargo test --locked --target ${{ matrix.target }} --jobs 2 -- --test-threads=1
      # Config profile transactions outside Linux (from the former
      # profile-consistency.yml; on Linux the full suite above covers them).
      - name: Test config profile transactions
        if: runner.os != 'Linux'
        run: cargo test --locked --no-default-features --features headless --target ${{ matrix.target }} --jobs 2 config::config

  migration-e2e:
    name: ${{ matrix.os }} migration CLI regression
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          key: migration-cli-${{ runner.os }}
      # Synthetic independent profiles only; no GUI dependencies or real credentials.
      - name: Build the headless CLI binary
        run: cargo build --locked --no-default-features --features headless --jobs 2
      - name: Stable-ID import and native snapshot migration
        run: python tests/migration_modes_e2e.py --exe "${{ runner.os == 'Windows' && 'target/debug/xenterm.exe' || 'target/debug/xenterm' }}"
      - name: Read-only full CLI migration previews
        run: python tests/migration_preview_e2e.py --exe "${{ runner.os == 'Windows' && 'target/debug/xenterm.exe' || 'target/debug/xenterm' }}"

  headless-e2e:
    name: Headless MCP regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y nginx
      - run: python -m pip install cryptography paramiko "mcp>=2.3,<3"
      - name: Headless unit tests (no GUI system dependencies)
        run: env -u ALL_PROXY -u all_proxy -u HTTP_PROXY -u http_proxy -u HTTPS_PROXY -u https_proxy cargo test --locked --no-default-features --features headless
      - run: cargo build --locked --no-default-features --features headless
      - run: python tests/config_import_e2e.py --exe target/debug/xenterm
      - run: python tests/config_export_e2e.py --exe target/debug/xenterm
      - run: python tests/cli_exec_e2e.py --exe target/debug/xenterm
      - run: python tests/access_policy_e2e.py --exe target/debug/xenterm
      - run: python tests/execution_log_e2e.py --exe target/debug/xenterm
      - run: python tests/migration_modes_e2e.py --exe target/debug/xenterm
      - run: python tests/migration_preview_e2e.py --exe target/debug/xenterm
      - run: python tests/ssh_jump_chain_e2e.py --exe target/debug/xenterm
      - run: python tests/ssh_stack_e2e.py --exe target/debug/xenterm
      - run: python tests/ssh_jump_chain_e2e.py --exe target/debug/xenterm --stage-timeouts
      - run: python tests/stdio_mcp_e2e.py --exe target/debug/xenterm
      - run: python tests/remote_mcp_e2e.py --exe target/debug/xenterm --path /mcp
      - run: python tests/remote_mcp_e2e.py --exe target/debug/xenterm --nginx /usr/sbin/nginx --path /xenterm/mcp
      - run: python tests/remote_mcp_e2e.py --exe target/debug/xenterm --nginx /usr/sbin/nginx --path /xenterm/mcp --protocol-version 2025-11-25

  windows-ssh:
    name: Windows SSH command stack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-ssh-stack
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography paramiko
      - run: cargo test --locked --no-default-features --features headless command_stack_tests
      - run: cargo build --locked --no-default-features --features headless
      - run: python tests/ssh_stack_e2e.py --exe target/debug/xenterm.exe
      - run: python tests/migration_modes_e2e.py --exe target/debug/xenterm.exe
      - run: python tests/migration_preview_e2e.py --exe target/debug/xenterm.exe

  installer:
    name: Linux installer check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils python3-gi gir1.2-glib-2.0
      - run: python3 tests/release_workflow_test.py
      - run: python3 tests/next_beta_test.py
      - name: Check installer syntax
        run: bash -n assets/install-linux.sh
      - name: Run isolated installer regressions
        run: /usr/bin/python3 tests/install_linux_test.py

  installer-windows:
    name: Windows MSI install upgrade uninstall
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/windows_installer_test.py
      - name: Install official WiX 3 toolset
        shell: pwsh
        run: |
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe"
          if (-not (Test-Path $wix)) { choco install wixtoolset -y --no-progress }
          if (-not (Test-Path $wix)) { throw 'WiX 3.14 candle.exe is required' }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify isolated MSI lifecycle
        shell: pwsh
        run: ./tests/windows_installer_e2e.ps1
      - name: Upload installer diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-diagnostics
          path: ${{ runner.temp }}/xenterm-msi-*/msi-*.log

  installer-macos:
    name: macOS PKG choices and payload
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/macos_installer_test.py
      - name: Build and inspect genuine Apple Installer packages
        run: bash tests/macos_installer_build.sh


  next-beta-dry-run:
    # Candidate validation after every normal CI gate succeeds for this same
    # SHA. Main keeps its separate completed-CI release gate; this job has no
    # publish step and cannot write a tag or release.
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.event_name == 'push' && github.ref == 'refs/heads/ci/next-beta-preview-20261014'
    needs: [desktop, migration-e2e, headless-e2e, windows-ssh, installer, installer-windows, installer-macos]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/next-beta-build.yml
    with:
      source_sha: ${{ github.sha }}
      ci_run: ${{ format('{0}', github.run_id) }}
