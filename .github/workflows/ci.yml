name: Validate interrupted UI flows (isolated)
# Topic-only validation: never integrate this replacement over product CI.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xenterm-sidebar-resize-validation
  cancel-in-progress: false
jobs:
  regression:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/test/sidebar-resize-gap-20261020' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      FILTER: ui::pages::terminal_page::sidebar_resize_tests
      LOST: ui::pages::terminal_page::sidebar_resize_tests::sidebar_release_outside_window_does_not_leave_hover_resizing
      ANIMATION: ui::pages::terminal_page::sidebar_resize_tests::sidebar_resize_during_expand_keeps_the_new_width_after_animation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Isolate GUI state
        shell: bash
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/sidebar-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/sidebar-data" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/sidebar-runtime" >> "$GITHUB_ENV"
      - name: Install desktop development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-check-x86_64-unknown-linux-gnu
          cache-on-failure: true
      - name: Compile and verify exact selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          rustc -Vv
          git rev-parse HEAD
          timeout 2400 cargo test --locked --target x86_64-unknown-linux-gnu --bin xenterm --jobs 2 "$FILTER" -- --list 2>&1 | tee flow-tests.txt
          grep -Fx "$LOST: test" flow-tests.txt
          grep -Fx "$ANIMATION: test" flow-tests.txt
      - name: Evaluate baseline interrupted user flows independently
        shell: bash
        run: |
          set -euo pipefail
          infra=0
          for entry in "$LOST" "$ANIMATION"; do
            name="${entry##*::}"
            result=0
            timeout 120 cargo test --locked --target x86_64-unknown-linux-gnu --bin xenterm --jobs 2 "$entry" -- --exact --test-threads=1 --nocapture > "$name.log" 2>&1 || result=$?
            cat "$name.log"
            echo "$result" > "$name.exit"
            # A timeout, compiler failure or missing test is not bug evidence.
            if test "$result" -eq 0; then
              grep -F 'test result: ok. 1 passed; 0 failed;' "$name.log" || infra=1
            elif test "$result" -eq 101; then
              grep -F 'test result: FAILED. 0 passed; 1 failed;' "$name.log" || infra=1
            else
              echo "Infrastructure/timeout exit: $result" >&2
              infra=1
            fi
          done
          exit "$infra"
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interrupted-flow-baseline-evidence
          path: |
            flow-tests.txt
            sidebar_*.log
            sidebar_*.exit
          if-no-files-found: warn
          retention-days: 14
