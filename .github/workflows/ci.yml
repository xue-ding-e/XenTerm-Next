name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xenterm-webpki-linux-validation
  cancel-in-progress: false
jobs:
  tls-ca:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/test/webpki-windows-20261022' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: Set overall 55-minute work deadline
        run: echo "XENTERM_WORK_DEADLINE=$(( $(date +%s) + 3300 ))" >> "$GITHUB_ENV"
      - timeout-minutes: 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - name: Verify single-parent harness and exact changed paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C harness rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA 6617bdde54e29007aafa1108105c2d4481a4ea6e"
          printf '%s\n' .github/workflows/ci.yml maintenance/webpki-linux/candidate.lock.patch maintenance/webpki-linux/verify.py > expected-paths
          git -C harness diff-tree --no-commit-id --name-only -r HEAD | sort > actual-paths
          diff -u expected-paths actual-paths
      - timeout-minutes: 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6617bdde54e29007aafa1108105c2d4481a4ea6e
          path: source
          persist-credentials: false
      - name: Install official desktop development libraries
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - timeout-minutes: 2
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-gnu
      - timeout-minutes: 2
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-linux-gnu
      - name: Set isolated test profile
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xenterm-ca-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/xenterm-ca-data" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xenterm-ca-runtime" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/xenterm-ca-runtime"
          chmod 700 "$RUNNER_TEMP/xenterm-ca-runtime"
      - name: Verify reused lock and serial Linux desktop/headless regression
        run: python3 harness/maintenance/webpki-linux/verify.py
      - name: Preserve evidence even on failure
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webpki-linux-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
