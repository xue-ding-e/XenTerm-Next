name: Native key import compile diagnostic (manual, no release)
# Local proposal: hosted lifecycle only. No raw logs or binaries uploaded.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed control SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: xenterm-key-import-native
  cancel-in-progress: false
jobs:
  windows:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/validation/key-import-native-20261029' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_CONTROL_SHA: ${{ inputs.expected_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - name: Checkout immutable control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout immutable GPUI source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8819e2ec132760047209e9dcff7341c5f8a15f94
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pure synthetic control guards
        timeout-minutes: 2
        run: python control/scripts/test_diagnose_native.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          cache-targets: false
          key: desktop-check-x86_64-pc-windows-msvc
      - name: Prepare exact candidate
        timeout-minutes: 2
        run: python control/scripts/native-key-import.py prepare
      - name: Compile original native crate once
        timeout-minutes: 3
        run: python control/scripts/diagnose-native.py
      - name: Preserve structured evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-import-native-windows-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/key-import-native-evidence/prepared.json
            ${{ runner.temp }}/key-import-native-evidence/binary.json
            ${{ runner.temp }}/key-import-native-evidence/commands.json
            ${{ runner.temp }}/key-import-native-evidence/tests.json
            ${{ runner.temp }}/key-import-native-evidence/receipt.json
            ${{ runner.temp }}/key-import-native-evidence/failure.json
            ${{ runner.temp }}/key-import-native-evidence/diagnostic.json
            ${{ runner.temp }}/key-import-native-evidence/tool-metadata.json
            ${{ runner.temp }}/key-import-native-evidence/link-smoke.json
