name: Validate SFTP connection error (isolated)

# Validation-topic-only replacement. Never integrate this workflow over main CI.
# No push/PR trigger: publishing the topic cannot start the broad desktop suite.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xenterm-sftp-connection-validation
  cancel-in-progress: false
jobs:
  regression:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/test/sftp-connection-error-20261019' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Compile and verify exact regression selection
        env:
        XDG_CONFIG_HOME: ${{ runner.temp }}/sftp-config
        XDG_DATA_HOME: ${{ runner.temp }}/sftp-data
        XDG_RUNTIME_DIR: ${{ runner.temp }}/sftp-runtime
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --no-default-features --features headless --bin xenterm --jobs 2 sftp::sftp::connection_failure_tests::connection_failure_emits_sftp_error -- --list --exact > sftp-tests.txt
          grep -Fx 'sftp::sftp::connection_failure_tests::connection_failure_emits_sftp_error: test' sftp-tests.txt
          test "$(grep -c ': test$' sftp-tests.txt)" = 1
      - name: Run actual spawn_sftp regression
        env:
        XDG_CONFIG_HOME: ${{ runner.temp }}/sftp-config
        XDG_DATA_HOME: ${{ runner.temp }}/sftp-data
        XDG_RUNTIME_DIR: ${{ runner.temp }}/sftp-runtime
        shell: bash
        run: |
          set -euo pipefail
          env -u ALL_PROXY -u all_proxy -u HTTP_PROXY -u http_proxy -u HTTPS_PROXY -u https_proxy cargo test --locked --no-default-features --features headless --bin xenterm --jobs 2 sftp::sftp::connection_failure_tests::connection_failure_emits_sftp_error -- --exact --test-threads=1 2>&1 | tee sftp-regression.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' sftp-regression.log
