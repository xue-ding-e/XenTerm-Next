name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xenterm-gui-msrv-188-validation
  cancel-in-progress: false
jobs:
  gui-msrv:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/test/gui-msrv-188-20261022' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - name: Verify single-parent harness and exact changed paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C harness rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA ec516928b618e0cbd8c70bd79fa0bb7378690274"
          printf '%s\n' .github/workflows/ci.yml maintenance/gui-msrv/verify.py > expected-paths
          git -C harness diff-tree --no-commit-id --name-only -r HEAD | sort > actual-paths
          diff -u expected-paths actual-paths
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ec516928b618e0cbd8c70bd79fa0bb7378690274
          path: source
          persist-credentials: false
      - name: Install official desktop development libraries
        timeout-minutes: 7
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-linux-gnu
      - name: Verify fixed source with metadata and default GUI check
        run: python3 harness/maintenance/gui-msrv/verify.py
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gui-msrv-188-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
