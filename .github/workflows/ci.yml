name: GPUI candidate validation (manual, no release)

# Control-branch only: test immutable product commits, never integrate this file.
# GPUI TestPlatform is not native macOS Dock event-delivery validation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-candidate-validation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  desktop:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/validation/gpui-candidates-20261027'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, toolchain: '1.99.1' }
          - { os: macos-14, target: aarch64-apple-darwin, toolchain: stable }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, toolchain: stable }
    steps:
      - name: Check out this validation control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          sparse-checkout: |
            scripts/gpui_candidate_validation.py
            tests/test_gpui_candidate_validation.py
          sparse-checkout-cone-mode: false
      - name: Check out immutable product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0205fe53a74fc286d075a3f7a9b56556be3e99f4
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify test-count guard
        run: python control/tests/test_gpui_candidate_validation.py
      - name: Install Linux desktop development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          key: desktop-check-${{ matrix.target }}
      - name: Enumerate and execute the 27 GPUI candidate tests
        working-directory: source
        run: python ../control/scripts/gpui_candidate_validation.py ${{ matrix.target }}
