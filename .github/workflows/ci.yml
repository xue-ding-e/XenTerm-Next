name: Forwarding slot regression (manual only)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed control commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: xenterm-forwarding-validation
  cancel-in-progress: false
jobs:
  forwarding:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/validation/forwarding-slots-20261028' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed control
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
          ref: ${{ github.sha }}
      - name: Verify immutable control checkout
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_CONTROL_SHA" = "$GITHUB_SHA"
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          repository: xue-ding-e/XenTerm-Next
          ref: d46a32e2e2c80d31fea3c03c7355a3f53b01b800
          persist-credentials: false
          path: source
      - name: Verify synthetic control gates (not product tests)
        timeout-minutes: 1
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: timeout 10s python3 control/scripts/test_validate_forwarding.py
      - name: Install backend build dependencies only
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev 
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          test "$(git -C source rev-parse HEAD)" = d46a32e2e2c80d31fea3c03c7355a3f53b01b800
          rustc +1.99.1 --version
          df -h .
          free -m
      - name: Compile once and verify actual forwarding tests
        timeout-minutes: 47
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: |
          set -euo pipefail
          ulimit -c 0
          ulimit -n 4096
          # RLIMIT_AS is per process, not aggregate RSS. Driver additionally samples
          # the dedicated process group about every 0.2s and aborts above 6 GiB.
          # Sampling is not a hard RSS limit: short-lived peaks may be missed.
          ulimit -v 6291456
          unset PYTHONOPTIMIZE
          /usr/bin/time -v python3 control/scripts/validate-forwarding.py "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/forwarding-evidence" 2> "$RUNNER_TEMP/forwarding-resources.log"
      - name: Upload bounded verification evidence (not binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forwarding-validation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/forwarding-evidence/*.json
            ${{ runner.temp }}/forwarding-evidence/*.log
            ${{ runner.temp }}/forwarding-resources.log
