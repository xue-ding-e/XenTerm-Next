name: Validate sidebar resize (isolated)
# Topic-only validation: never integrate this replacement over product CI.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xenterm-sidebar-resize-validation
  cancel-in-progress: false
jobs:
  regression:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/test/sidebar-resize-gap-20261020' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      TEST: ui::pages::terminal_page::sidebar_resize_tests::sidebar_drag_keeps_content_aligned_and_restores_resized_width
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Isolate GUI state
        shell: bash
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/sidebar-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/sidebar-data" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/sidebar-runtime" >> "$GITHUB_ENV"
      - name: Install desktop development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-check-x86_64-unknown-linux-gnu
      - name: Compile regression and verify selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          rustc -Vv
          git rev-parse HEAD
          timeout 2400 cargo test --locked --bin xenterm --jobs 2 "$TEST" -- --list --exact | tee sidebar-tests.txt
          grep -Fx "$TEST: test" sidebar-tests.txt
      - name: Require baseline failure at resized content assertion
        shell: bash
        run: |
          set -uo pipefail
          timeout 120 cargo test --locked --bin xenterm --jobs 2 "$TEST" -- --exact --test-threads=1 --nocapture > sidebar-red.log 2>&1
          result=$?
          cat sidebar-red.log
          test "$result" -eq 101 || exit 1
          grep -F 'sidebar content must follow resized column' sidebar-red.log || exit 1
          grep -F '0 passed; 1 failed;' sidebar-red.log || exit 1
      - name: Apply minimal width synchronization and require green
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui/impls/sidebar.rs')
          old = '        self.store.borrow_mut().set_sidebar_width(clamped);\n        self.shown_width = clamped;'
          text = p.read_text()
          assert text.count(old) == 1
          p.write_text(text.replace(old, old.replace('        self.shown_width', '        self.width = clamped;\n        self.shown_width')))
          PY
          git diff -- src/ui/impls/sidebar.rs
          timeout 600 cargo test --locked --bin xenterm --jobs 2 "$TEST" -- --exact --test-threads=1 --nocapture | tee sidebar-green.log
          grep -F '1 passed; 0 failed;' sidebar-green.log
          timeout 120 cargo test --locked --bin xenterm --jobs 2 ui::sidebar::resource_tests -- --test-threads=1
