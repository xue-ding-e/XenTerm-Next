name: Validate interrupted UI flows (isolated)
# Topic-only validation: never integrate this replacement over product CI.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xenterm-sidebar-resize-validation
  cancel-in-progress: false
jobs:
  regression:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/test/sidebar-resize-gap-20261020' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      FILTER: ui::pages::terminal_page::sidebar_resize_tests
      DOCK: ui::pages::terminal_page::dock_tests::file_panel_bottom_resize_stops_after_a_lost_mouse_release
      LOST: ui::pages::terminal_page::sidebar_resize_tests::sidebar_release_outside_window_does_not_leave_hover_resizing
      ANIMATION: ui::pages::terminal_page::sidebar_resize_tests::sidebar_resize_during_expand_keeps_the_new_width_after_animation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Isolate GUI state
        shell: bash
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/sidebar-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/sidebar-data" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/sidebar-runtime" >> "$GITHUB_ENV"
      - name: Install desktop development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-check-x86_64-unknown-linux-gnu
          cache-on-failure: true
      - name: Verify added regressions fail on unchanged behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          rustc -Vv
          git rev-parse HEAD
          cp src/ui/impls/sidebar.rs /tmp/sidebar-fixed.rs
          cp src/ui/impls/pages/terminal_page.rs /tmp/terminal-fixed.rs
          python3 .github/scripts/flow-baseline.py
          timeout 2400 cargo test --locked --target x86_64-unknown-linux-gnu --bin xenterm --jobs 2 --no-run --message-format=json > flow-baseline-build.json
          python3 .github/scripts/flow-test-binary.py flow-baseline-build.json > flow-binary.txt
          binary=$(cat flow-binary.txt)
          "$binary" --list > flow-tests.txt
          infra=0
          for name in sidebar_collapsing_edge_does_not_start_a_resize sidebar_same_width_grab_during_expand_retargets_content_and_animation; do
            test="$FILTER::$name"
            grep -Fx "$test: test" flow-tests.txt || infra=1
            result=0
            timeout 120 "$binary" "$test" --exact --test-threads=1 --nocapture > "$name-red.log" 2>&1 || result=$?
            cat "$name-red.log"
            echo "$result" > "$name-red.exit"
            test "$result" -eq 101 || infra=1
            grep -F 'test result: FAILED. 0 passed; 1 failed;' "$name-red.log" || infra=1
          done
          result=0
          grep -Fx "$DOCK: test" flow-tests.txt || infra=1
          timeout 120 "$binary" "$DOCK" --exact --test-threads=1 --nocapture > dock-red.log 2>&1 || result=$?
          cat dock-red.log
          echo "$result" > dock-red.exit
          test "$result" -eq 101 || infra=1
          grep -F 'test result: FAILED. 0 passed; 1 failed;' dock-red.log || infra=1
          # Only these behavioral assertions qualify as RED, not fixture timing.
          grep -F 'collapsing sidebar cannot start a resize' sidebar_collapsing_edge_does_not_start_a_resize-red.log || infra=1
          grep -F 'same-width grab updates the old content target' sidebar_same_width_grab_during_expand_retargets_content_and_animation-red.log || infra=1
          grep -F 'dock hover after lost release must not resize' dock-red.log || infra=1
          exit "$infra"
      - name: Restore exact candidate and require focused GREEN and existing UI suite
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/sidebar-fixed.rs src/ui/impls/sidebar.rs
          cp /tmp/terminal-fixed.rs src/ui/impls/pages/terminal_page.rs
          git diff --exit-code -- src/ui/impls/sidebar.rs src/ui/impls/pages/terminal_page.rs
          sha256sum src/ui/impls/sidebar.rs src/ui/impls/pages/terminal_page.rs src/ui/impls/pages/sidebar_resize_tests.rs > flow-source-sha256.txt
          timeout 600 cargo test --locked --target x86_64-unknown-linux-gnu --bin xenterm --jobs 2 --no-run --message-format=json > flow-green-build.json
          python3 .github/scripts/flow-test-binary.py flow-green-build.json > flow-binary.txt
          binary=$(cat flow-binary.txt)
          timeout 120 "$binary" "$FILTER" --test-threads=1 --nocapture 2>&1 | tee sidebar-green.log
          grep -F 'test result: ok. 5 passed; 0 failed;' sidebar-green.log
          timeout 120 "$binary" "$DOCK" --exact --test-threads=1 --nocapture 2>&1 | tee dock-green.log
          grep -F 'test result: ok. 1 passed; 0 failed;' dock-green.log
          timeout 600 "$binary" ui:: --test-threads=1 2>&1 | tee flow-ui-suite.log
          grep -E 'test result: ok\. [1-9][0-9]+ passed; 0 failed;' flow-ui-suite.log
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interrupted-flow-red-green-evidence
          path: |
            flow-*.txt
            flow-*.json
            flow-*.log
            sidebar*.log
            sidebar*.exit
            dock*.log
            dock*.exit
          if-no-files-found: warn
          retention-days: 14
