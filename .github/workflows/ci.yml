name: Validate interrupted UI flows (isolated)
# Topic-only validation: never integrate this replacement over product CI.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xenterm-sidebar-resize-validation
  cancel-in-progress: false
jobs:
  regression:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/test/sidebar-resize-gap-20261020' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      FILTER: ui::pages::terminal_page::sidebar_resize_tests
      DOCK: ui::pages::terminal_page::dock_tests::file_panel_bottom_resize_stops_after_a_lost_mouse_release
      LOST: ui::pages::terminal_page::sidebar_resize_tests::sidebar_release_outside_window_does_not_leave_hover_resizing
      ANIMATION: ui::pages::terminal_page::sidebar_resize_tests::sidebar_resize_during_expand_keeps_the_new_width_after_animation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Isolate GUI state
        shell: bash
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/sidebar-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/sidebar-data" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/sidebar-runtime" >> "$GITHUB_ENV"
      - name: Install desktop development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev xvfb xauth x11-utils x11-apps mesa-vulkan-drivers libgl1-mesa-dri imagemagick
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-check-x86_64-unknown-linux-gnu
          cache-on-failure: true
      - name: Reproduce empty landing resize and retain populated control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          git rev-parse HEAD > flow-source.txt
          timeout 1800 cargo test --locked --target x86_64-unknown-linux-gnu --bin xenterm --jobs 2 --no-run --message-format=json > flow-build.json
          python3 .github/scripts/flow-test-binary.py flow-build.json > flow-binary.txt
          binary=$(cat flow-binary.txt)
          "$binary" --list > flow-tests.txt
          failed=0
          red=ui::pages::terminal_page::sidebar_resize_tests::empty_landing_sidebar_drag_updates_content_and_stops_after_release
          control=ui::pages::terminal_page::sidebar_resize_tests::sidebar_drag_keeps_content_aligned_and_restores_resized_width
          result=0
          timeout 90 "$binary" "$red" --exact --test-threads=1 --nocapture > flow-empty-red.log 2>&1 || result=$?
          echo "$result" > flow-empty-red-exit.txt
          cat flow-empty-red.log
          if [ "$result" -ne 101 ]; then failed=1; fi
          grep -F 'test result: FAILED. 0 passed; 1 failed;' flow-empty-red.log || failed=1
          grep -F 'empty landing resize affordance must receive the actual pointer press' flow-empty-red.log || failed=1
          result=0
          timeout 90 "$binary" "$control" --exact --test-threads=1 --nocapture > flow-populated-control.log 2>&1 || result=$?
          echo "$result" > flow-populated-control-exit.txt
          cat flow-populated-control.log
          if [ "$result" -ne 0 ]; then failed=1; fi
          grep -F 'test result: ok. 1 passed; 0 failed;' flow-populated-control.log || failed=1
          exit "$failed"
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interrupted-flow-red-green-evidence
          path: |
            native-*.txt
            native-*.log
            native-*.png
            flow-*.txt
            flow-*.json
            flow-*.log
            sidebar*.log
            sidebar*.exit
            dock*.log
            dock*.exit
          if-no-files-found: warn
          retention-days: 14
