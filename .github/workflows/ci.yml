name: Exact Windows startup dependency diagnostic (manual)
# Isolated diagnostic only: never integrate this harness over product CI.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-native-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-reuse:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/test/sidebar-resize-gap-20261020' && github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -STA -File {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Parse every probe script before native execution
        timeout-minutes: 1
        run: |
          $ErrorActionPreference='Stop'
          foreach ($file in Get-ChildItem ./scripts/windows-native/*.ps1) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($file.Name+': '+(($errors | ForEach-Object Message) -join '; ')) }
          }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/native-evidence" | Out-Null
      - name: Verify exact producer and artifact metadata without credentials
        timeout-minutes: 1
        run: '& ./scripts/windows-native/verify-producer.ps1'
      - name: Download only the exact existing artifact; never rebuild
        timeout-minutes: 3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: xue-ding-e/XenTerm-Next
          run-id: '39415201204'
          artifact-ids: '12261619305'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/xenterm-exact-reuse
      - name: Verify manifest, source objects and executable bytes
        id: verified
        timeout-minutes: 1
        run: '& ./scripts/windows-native/verify-reuse.ps1'
      - name: Read only executable import names and matching installed DLL metadata
        if: steps.verified.outputs.identity_gate == 'verified'
        timeout-minutes: 1
        run: '& ./scripts/windows-native/inspect-dependencies.ps1'
      - name: Native visible WinForms control immediately before launch
        id: preflight
        if: steps.verified.outputs.identity_gate == 'verified'
        timeout-minutes: 2
        run: |
          & ./scripts/windows-native/preflight.ps1 -EvidenceDir "$env:RUNNER_TEMP/native-evidence/prelaunch"
          exit $LASTEXITCODE
      - name: Observe one owned startup without any input
        id: smoke
        if: steps.preflight.outputs.desktop_gate == 'passed'
        timeout-minutes: 2
        run: |
          & ./scripts/windows-native/smoke.ps1 -SourceDir "$env:GITHUB_WORKSPACE" -EvidenceDir "$env:RUNNER_TEMP/native-evidence/app" -VerifiedDir "$env:RUNNER_TEMP/xenterm-exact-reuse" -PreflightDir "$env:RUNNER_TEMP/native-evidence/prelaunch"
          exit $LASTEXITCODE
      - name: Preserve bounded evidence only; never profile or executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-startup-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-evidence/
          if-no-files-found: warn
          retention-days: 3
      - name: Require all diagnostic gates without claiming complete native QA
        if: always()
        env:
          IDENTITY_GATE: ${{ steps.verified.outputs.identity_gate }}
          DESKTOP_GATE: ${{ steps.preflight.outputs.desktop_gate }}
          SMOKE_GATE: ${{ steps.smoke.outputs.smoke_gate }}
        run: |
          "Artifact identity=$env:IDENTITY_GATE; visible desktop=$env:DESKTOP_GATE; no-input startup=$env:SMOKE_GATE. Inspect exit metadata/screenshots; input is disabled and navigation remains unverified." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($env:IDENTITY_GATE -ne 'verified' -or $env:DESKTOP_GATE -ne 'passed' -or $env:SMOKE_GATE -ne 'needs_visual_review') { throw 'Diagnostic incomplete or failed; do not infer a navigation fix or retry input.' }
