name: Installed VS discovery differential (manual only)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: xenterm-product-validation
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/validation/xenterm-vs-discovery-diagnostic-20261031' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: windows-2025
    timeout-minutes: 5
    env:
      EXPECTED_CONTROL_SHA: ${{ inputs.expected_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Two bounded read-only queries, no product or Host builds
        shell: pwsh
        timeout-minutes: 3
        run: python validation/key-import-compile/adapter/diagnose_vs_discovery.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vs-discovery-diagnostic
          path: ${{ runner.temp }}/vs-discovery-diagnostic/summary.json
          if-no-files-found: error
          retention-days: 7
