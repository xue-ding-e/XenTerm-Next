name: Isolated SFTP CLOSE timeout coverage (manual)
# Validation branch only; never integrate this replacement into product main.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sftp-close-timeout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  close_timeout:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/test/sftp-close-timeout-20261021' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          ref: d9b0605b378031288de99975f06354cfa2e5312d
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, same defaults as headless CI
        with:
          workspaces: source -> target
      - name: Compile exact locked source and require five exact SFTP protocol cases
        run: python3 harness/scripts/sftp-close-timeout/verify.py
      - name: Preserve verification logs and identities even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sftp-close-timeout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sftp-close-timeout-evidence/
          if-no-files-found: warn
          retention-days: 3
