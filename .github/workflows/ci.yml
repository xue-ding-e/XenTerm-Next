name: Native WebDAV TLS validation (manual, no release)
# Isolated control branch only. Hosted runner lifecycle is the sole boundary;
# no custom process-tree ownership, zero-residue or total-RSS claim is made.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact independently reviewed control SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: xenterm-webdav-native-validation
  cancel-in-progress: false
jobs:
  windows:
    
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/validation/webdav-native-20261029' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_CONTROL_SHA: ${{ inputs.expected_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      # Process-scoped Git configuration keeps reviewed source/patch bytes LF
      # on Windows too, without mutating runner-global or user Git config.
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - name: Checkout immutable control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout immutable GPUI product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 79ef3363f0f600f5674ee2c245b5eb357f855961
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Synthetic guards only
        timeout-minutes: 2
        run: python control/scripts/test_native_webdav.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          key: desktop-check-x86_64-pc-windows-msvc
      - name: Prepare exact upgraded candidate and isolated profile
        timeout-minutes: 2
        run: python control/scripts/native-webdav.py prepare
      - name: Compile native product test executable once
        timeout-minutes: 45
        working-directory: source
        run: |
          set -euo pipefail
          unset XT_VERSION XT_CHANNEL HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          export GITHUB_SHA=79ef3363f0f600f5674ee2c245b5eb357f855961
          export GITHUB_REF_TYPE=branch
          export GITHUB_REF_NAME=validation/webdav-native-20261029
          rustc -vV | tee "$WEBDAV_EVIDENCE/toolchain.log"
          cargo tree --locked -e features -i rustls | tee "$WEBDAV_EVIDENCE/features.log"
          cargo test --locked --bin xenterm --target x86_64-pc-windows-msvc --jobs 2 --no-run --message-format=json 2>&1 | tee "$WEBDAV_EVIDENCE/compile.log"
      - name: Bind compiled binary features and hash
        timeout-minutes: 2
        run: python control/scripts/native-webdav.py compile-receipt x86_64-pc-windows-msvc
      - name: Enumerate default-rejection test
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python control/scripts/native-webdav.py exec 0 list | tee "$WEBDAV_EVIDENCE/list-0.log"
      - name: Execute real native default-rejection TLS test
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python control/scripts/native-webdav.py exec 0 test | tee "$WEBDAV_EVIDENCE/test-0.log"
      - name: Verify default rejection exact count and hash
        timeout-minutes: 1
        run: python control/scripts/native-webdav.py verify-test 0
      - name: Enumerate explicit-opt-in test
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python control/scripts/native-webdav.py exec 1 list | tee "$WEBDAV_EVIDENCE/list-1.log"
      - name: Execute real native explicit-opt-in TLS test
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python control/scripts/native-webdav.py exec 1 test | tee "$WEBDAV_EVIDENCE/test-1.log"
      - name: Verify explicit opt-in exact count and hash
        timeout-minutes: 1
        run: python control/scripts/native-webdav.py verify-test 1
      - name: Verify immutable source and write bounded-scope receipt
        timeout-minutes: 2
        run: python control/scripts/native-webdav.py finish
      # On failure/timeout, do not signal uncertain PID/name targets. Remaining
      # lifecycle belongs to the hosted runner. No later tests or platform run.
      - name: Preserve evidence only, never product binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdav-native-windows-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/webdav-native-evidence/*.json
            ${{ runner.temp }}/webdav-native-evidence/*.log
  macos:
    needs: windows
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/validation/webdav-native-20261029' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_CONTROL_SHA: ${{ inputs.expected_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      # Process-scoped Git configuration keeps reviewed source/patch bytes LF
      # on Windows too, without mutating runner-global or user Git config.
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - name: Checkout immutable control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout immutable GPUI product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 79ef3363f0f600f5674ee2c245b5eb357f855961
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Synthetic guards only
        timeout-minutes: 2
        run: python control/scripts/test_native_webdav.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          key: desktop-check-aarch64-apple-darwin
      - name: Prepare exact upgraded candidate and isolated profile
        timeout-minutes: 2
        run: python control/scripts/native-webdav.py prepare
      - name: Compile native product test executable once
        timeout-minutes: 45
        working-directory: source
        run: |
          set -euo pipefail
          unset XT_VERSION XT_CHANNEL HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          export GITHUB_SHA=79ef3363f0f600f5674ee2c245b5eb357f855961
          export GITHUB_REF_TYPE=branch
          export GITHUB_REF_NAME=validation/webdav-native-20261029
          rustc -vV | tee "$WEBDAV_EVIDENCE/toolchain.log"
          cargo tree --locked -e features -i rustls | tee "$WEBDAV_EVIDENCE/features.log"
          cargo test --locked --bin xenterm --target aarch64-apple-darwin --jobs 2 --no-run --message-format=json 2>&1 | tee "$WEBDAV_EVIDENCE/compile.log"
      - name: Bind compiled binary features and hash
        timeout-minutes: 2
        run: python control/scripts/native-webdav.py compile-receipt aarch64-apple-darwin
      - name: Enumerate default-rejection test
        timeout-minutes: 1
        run: |
