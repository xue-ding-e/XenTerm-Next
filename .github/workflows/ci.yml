name: Isolated Rust 1.88 compatibility feasibility (manual)
# Validation branch only; never integrate this replacement into product main.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: msrv-compat-${{ github.ref }}
  cancel-in-progress: false
jobs:
  msrv_probe:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/test/msrv-compat-188-v2-20261021' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          ref: 16ccb477efe01445c784d4c2ace198c4830f0b9a
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.88.0
      - name: Validate derived AES-only lock then compile Rust 1.88 headless and exact helper tests
        run: python3 harness/scripts/msrv-compat/verify.py
      - name: Preserve verification logs and identities even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msrv-compat-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/msrv-compat-evidence/
          if-no-files-found: warn
          retention-days: 3
