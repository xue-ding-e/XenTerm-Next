name: GPUI candidate validation (manual, no release)
# LOCAL PROPOSAL replacing the existing control workflow, never a product file.
# Linux /proc resource owner only; Windows/macOS native TLS remain separate gates.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed control SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gpui-candidate-validation-${{ github.repository }}
  cancel-in-progress: false
jobs:
  desktop:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/validation/webdav-tls-20261029' && inputs.expected_sha == github.sha
    runs-on: ubuntu-22.04
    timeout-minutes: 160
    steps:
      - name: Checkout exact reviewed control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout immutable GPUI source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 79ef3363f0f600f5674ee2c245b5eb357f855961
          path: source
          persist-credentials: false
      - name: Verify control guards without compiling product
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: timeout 30s python3 control/scripts/test_validate_webdav.py
      - name: Install Linux desktop development libraries
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          targets: x86_64-unknown-linux-gnu
      - name: Retain explicit Linux headless minimum toolchain
        timeout-minutes: 5
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          key: desktop-check-x86_64-unknown-linux-gnu
          cache-targets: false
      - name: Original-lock and upgraded-lock exact TLS tests, then MSRV
        timeout-minutes: 145
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          unset PYTHONOPTIMIZE
          ulimit -c 0
          ulimit -n 4096
          ulimit -v 6291456
          # Reuse existing owner: sampled process-group RSS <=6 GiB; minimum disk
          # 2 GiB; output cap 64 MiB during compile; bounded kill/reap on failure.
          # Sampling is not a hard aggregate RSS limit. Cold GUI time is unknown.
          python3 control/scripts/validate-webdav.py "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/webdav-validation"
      - name: Preserve bounded evidence, never product binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdav-validation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/webdav-validation/*.json
            ${{ runner.temp }}/webdav-validation/*.log
