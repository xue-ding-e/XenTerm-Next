name: GPUI candidate validation (manual, no release)
# LOCAL PROPOSAL replacing the existing control workflow, never a product file.
# Linux /proc owner; synthetic GPUI only, not a native desktop/SSH acceptance.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed control SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gpui-candidate-validation-${{ github.repository }}
  cancel-in-progress: false
jobs:
  desktop:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/validation/key-import-busy-save-20261029' && inputs.expected_sha == github.sha
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact reviewed control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout immutable GPUI source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8819e2ec132760047209e9dcff7341c5f8a15f94
          path: source
          persist-credentials: false
      - name: Verify control guards without compiling product
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: timeout 30s python3 control/scripts/test_validate_key_import.py
      - name: Install Linux desktop development libraries
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          key: desktop-check-x86_64-unknown-linux-gnu
          cache-targets: false
      - name: Compile original crate and run three exact synthetic GPUI cases
        timeout-minutes: 54
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          unset PYTHONOPTIMIZE
          ulimit -c 0
          ulimit -n 4096
          ulimit -v 6291456
          # Reuse existing owner: sampled process-group RSS <=6 GiB; minimum disk
          # 2 GiB; output cap 64 MiB during compile; bounded kill/reap on failure.
          # Sampling is not a hard aggregate RSS limit. Cold GUI time is unknown.
          python3 control/scripts/validate-key-import.py "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/key-import-validation"
      - name: Preserve bounded evidence, never product binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-import-validation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/key-import-validation/log-identities.json
            ${{ runner.temp }}/key-import-validation/receipt.json
            ${{ runner.temp }}/key-import-validation/tests.json
            ${{ runner.temp }}/key-import-validation/failure.json
            ${{ runner.temp }}/key-import-validation/webdav-commands.json
