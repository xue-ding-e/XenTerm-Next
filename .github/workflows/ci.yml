name: Validate russh 0.64 compatibility (isolated)

# Validation-topic-only replacement. Never integrate this workflow over main CI.
# No push/PR trigger: publishing the topic cannot start the broad desktop suite.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xenterm-russh064-validation
  cancel-in-progress: false
jobs:
  regression:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/test/russh064-compat-20261020' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.89.0
      - name: Verify source and explicit toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          rustc +1.89.0 --version
          cargo +1.89.0 --version
      - name: Compile and verify exact regression selection
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/russh064-config
          XDG_DATA_HOME: ${{ runner.temp }}/russh064-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/russh064-runtime
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked --no-default-features --features headless --bin xenterm --jobs 2 host_certificate_tests::rejects_host_certificate_without_prompting -- --list > russh064-tests.txt
          grep -Fx 'ssh::ssh::host_certificate_tests::rejects_host_certificate_without_prompting: test' russh064-tests.txt
          grep -Fx 'sftp::sftp::host_certificate_tests::rejects_host_certificate_without_prompting: test' russh064-tests.txt
          test "$(grep -c ': test$' russh064-tests.txt)" = 2
          cargo +1.89.0 test --locked --no-default-features --features headless --bin xenterm --jobs 2 utf8_boundary_tests -- --list > utf8-tests.txt
          grep -Fx 'ssh::ssh::utf8_boundary_tests::ascii_boundaries_are_unchanged: test' utf8-tests.txt
          grep -Fx 'ssh::ssh::utf8_boundary_tests::multibyte_boundaries_round_up_and_trigger_tail_stays_valid: test' utf8-tests.txt
          grep -Fx 'ssh::ssh::utf8_boundary_tests::out_of_range_and_empty_indices_clamp_to_length: test' utf8-tests.txt
          test "$(grep -c ': test$' utf8-tests.txt)" = 3
      - name: Run both actual host-key handlers
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/russh064-config
          XDG_DATA_HOME: ${{ runner.temp }}/russh064-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/russh064-runtime
        shell: bash
        run: |
          set -euo pipefail
          env -u ALL_PROXY -u all_proxy -u HTTP_PROXY -u http_proxy -u HTTPS_PROXY -u https_proxy cargo +1.89.0 test --locked --no-default-features --features headless --bin xenterm --jobs 2 host_certificate_tests::rejects_host_certificate_without_prompting -- --test-threads=1 2>&1 | tee russh064-regression.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' russh064-regression.log
          cargo +1.89.0 test --locked --no-default-features --features headless --bin xenterm --jobs 2 utf8_boundary_tests -- --test-threads=1 2>&1 | tee utf8-regression.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' utf8-regression.log
      - name: Verify and run actual forwarding protocol cases
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/russh064-config
          XDG_DATA_HOME: ${{ runner.temp }}/russh064-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/russh064-runtime
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked --no-default-features --features headless --bin xenterm --jobs 2 forwarding_protocol_tests -- --list > forwarding-tests.txt
          for name in forwarded_tcpip_confirms_and_splices_loopback forwarded_tcpip_confirms_before_local_connect_failure forwarded_tcpip_confirms_without_mapping forwarded_tcpip_confirms_at_cap_without_dialing; do
            grep -Fx "ssh::ssh::forwarding_protocol_tests::$name: test" forwarding-tests.txt
          done
          test "$(grep -c ': test$' forwarding-tests.txt)" = 4
          timeout 120s cargo +1.89.0 test --locked --no-default-features --features headless --bin xenterm --jobs 2 forwarding_protocol_tests -- --test-threads=1 --nocapture 2>&1 | tee forwarding-green.log
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' forwarding-green.log
      - name: Prove removal of acceptance fails the protocol assertion
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/russh064-config
          XDG_DATA_HOME: ${{ runner.temp }}/russh064-data
          XDG_RUNTIME_DIR: ${{ runner.temp }}/russh064-runtime
        shell: bash
        run: |
          set -euo pipefail
          source=src/ssh/impls/ssh.rs
          before=$(sha256sum "$source" | cut -d ' ' -f 1)
          cp "$source" "$RUNNER_TEMP/ssh-before-mutation.rs"
          trap 'cp "$RUNNER_TEMP/ssh-before-mutation.rs" "$source"' EXIT
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('src/ssh/impls/ssh.rs')
          s = p.read_text()
          needle = '        reply.accept().await;'
          assert s.count(needle) == 1, 'accept mutation must target exactly one production call'
          p.write_text(s.replace(needle, '        drop(reply); // CI-only negative control: explicit rejection on drop', 1))
          PYCODE
          # Compile separately: compilation failure is never the expected RED.
          cargo +1.89.0 test --locked --no-default-features --features headless --bin xenterm --jobs 2 forwarding_protocol_tests --no-run
          set +e
          timeout 120s cargo +1.89.0 test --locked --no-default-features --features headless --bin xenterm --jobs 2 ssh::ssh::forwarding_protocol_tests::forwarded_tcpip_confirms_and_splices_loopback -- --exact --test-threads=1 --nocapture > forwarding-mutation.log 2>&1
          result=$?
          set -e
          cat forwarding-mutation.log
          test "$result" = 101
          grep -F 'forwarded channel must be confirmed' forwarding-mutation.log
          grep -F 'test result: FAILED. 0 passed; 1 failed; 0 ignored;' forwarding-mutation.log
          if grep -Ei 'timed out|cleanup failed|could not compile|error\[E[0-9]+\]' forwarding-mutation.log; then
            echo 'Negative control failed outside the required protocol assertion' >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/ssh-before-mutation.rs" "$source"
          test "$(sha256sum "$source" | cut -d ' ' -f 1)" = "$before"
          git diff --exit-code -- "$source"
          trap - EXIT
