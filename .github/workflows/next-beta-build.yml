name: Build XenTerm Next desktop artifacts

# Read-only reusable packaging. No release/tag API, write token or secrets.
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      ci_run:
        required: true
        type: string
    outputs:
      version_metadata:
        description: Runtime and package version resolved once for this build
        value: ${{ jobs.prepare.outputs.version_metadata }}

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    outputs:
      xt_version: ${{ steps.version.outputs.xt_version }}
      version_metadata: ${{ steps.version.outputs.version_metadata }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Resolve one product runtime version for every platform
        id: version
        run: python3 scripts/packaging_version.py . --source-sha "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 90 }}
    strategy:
      # Publication needs all platforms; stop queued builds after a known failure.
      fail-fast: true
      # Release packaging shares the same one-heavy-runner budget as CI.
      max-parallel: 1
      matrix:
        include:
          - {os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64}
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64}
          - {os: macos-15, target: aarch64-apple-darwin, platform: macos-aarch64}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CI_RUN_ID: ${{ inputs.ci_run }}
      TARGET: ${{ matrix.target }}
      XENTERM_PACKAGE_PLATFORM: ${{ matrix.platform }}
      XT_VERSION: ${{ needs.prepare.outputs.xt_version }}
      XENTERM_VERSION_METADATA: ${{ needs.prepare.outputs.version_metadata }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify synthetic profile preservation contracts
        timeout-minutes: 2
        shell: pwsh
        run: |
          python tests/test_packaging_version.py
          if ($LASTEXITCODE -ne 0) { throw "Version contracts failed" }
          python tests/test_gpui_profile_evidence.py
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic profile contracts failed' }
          python tests/test_next_gpui_msi.py
          if ($LASTEXITCODE -ne 0) { throw 'Heat directory and packaging contracts failed' }
          ./tests/test_gpui_msi_property.ps1
          ./tests/test_gpui_registration.ps1 -Script ./scripts/gpui_msi_registration_evidence.ps1
          ./tests/test_gpui_initialization.ps1 -Script ./scripts/initialize_gpui_test_profile.ps1
          ./tests/test_gpui_gui_observation.ps1 -Script ./scripts/gpui_msi_gui_observation.ps1 -LifecycleScript ./scripts/test_next_gpui_msi_e2e.ps1
          ./tests/test_gpui_profile_environment.ps1 -Script ./scripts/package_next_gpui_msi.ps1
        if: runner.os == 'Windows'
      - name: Prepare pinned portable WiX toolset
        timeout-minutes: 5
        shell: pwsh
        run: |
          $wix = & ./scripts/install-wix.ps1
          "GPUI_WIX_BIN=$wix" >> $env:GITHUB_ENV
        if: runner.os == 'Windows'
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, verified 2026-10-14
        with:
          targets: ${{ matrix.target }}
      - name: Use static Microsoft C runtime for portable Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: next-gpui-release-${{ matrix.target }}
          cache-on-failure: true
      - name: Build locked release
        # Windows must leave time for native MSI acceptance and always evidence.
        timeout-minutes: ${{ matrix.os == 'windows-latest' && 70 || 90 }}
        run: cargo build --locked --release --target ${{ matrix.target }} --jobs 2
      - name: Reject unpackaged Microsoft runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deps = & dumpbin /DEPENDENTS "target/$env:TARGET/release/xenterm.exe"
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          $deps | Out-Host
          if (($deps -join "`n") -match '(?i)(VCRUNTIME|MSVCP|CONCRT)\d+[^\s]*\.dll') {
            throw 'Portable EXE still needs unpackaged Microsoft C++ runtime DLLs'
          }
      - name: Package and verify binary version
        run: python3 scripts/next_beta_package.py
      - name: Build and verify real GPUI MSI from this exact release bundle
        timeout-minutes: 25
        shell: pwsh
        run: |
          $stem = "XenTerm-Next-beta-$env:SOURCE_SHA-windows-x86_64"
          $bundle = Join-Path $pwd "next-stage/$stem"
          $wix = $env:GPUI_WIX_BIN
          $msi = Join-Path $pwd "dist/$stem.msi"
          ./scripts/package_next_gpui_msi.ps1 -BundleDir $bundle -SourceSha $env:SOURCE_SHA -WixBin $wix -Output $msi -EvidenceDir "$env:RUNNER_TEMP/gpui-packaging-evidence"
          # A fixed real prior beta, never relabeled as this build. This tests
          # actual old-source -> current-source payload replacement as well as
          # the MSI transaction. Hash-check before extraction or execution.
          # Shared reviewed retention pin; never delete or replace this old baseline.
          $pinText = & python -c "import json,sys; sys.path.insert(0,'scripts'); from next_beta import GPUI_UPGRADE_BASELINE; print(json.dumps(GPUI_UPGRADE_BASELINE))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not load retained GPUI baseline pin' }
          $pin = $pinText | ConvertFrom-Json
          $oldSha = $pin.source_sha
          $oldStem = "XenTerm-Next-beta-$oldSha-windows-x86_64"
          $oldZip = Join-Path $env:RUNNER_TEMP 'gpui-real-prior.zip'
          Invoke-WebRequest "https://github.com/xue-ding-e/XenTerm-Next/releases/download/beta/$($pin.name)" -OutFile $oldZip
          if ((Get-Item -LiteralPath $oldZip).Length -ne $pin.size) { throw 'Retained GPUI baseline size mismatch' }
          if ((Get-FileHash $oldZip -Algorithm SHA256).Hash -ine $pin.sha256) { throw 'Prior real GPUI archive hash mismatch' }
          $oldRoot = Join-Path $env:RUNNER_TEMP 'gpui-real-prior'
          Expand-Archive -LiteralPath $oldZip -DestinationPath $oldRoot
          $previous = Join-Path $env:RUNNER_TEMP 'gpui-real-prior.msi'
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/gpui-installer-evidence" -Force | Out-Null
          ./tests/test_gpui_native_environment.ps1 -Exe "$oldRoot/$oldStem/xenterm.exe" -PackagingScript ./scripts/package_next_gpui_msi.ps1 -Output "$env:RUNNER_TEMP/gpui-installer-evidence/native-environment.json"
          ./scripts/package_next_gpui_msi.ps1 -BundleDir "$oldRoot/$oldStem" -SourceSha $oldSha -WixBin $wix -Output $previous -EvidenceDir "$env:RUNNER_TEMP/gpui-packaging-evidence"
          $same = Join-Path $env:RUNNER_TEMP 'gpui-equal-build-fixture.msi'
          ./scripts/package_next_gpui_msi.ps1 -BundleDir $bundle -SourceSha $env:SOURCE_SHA -WixBin $wix -Output $same -EvidenceDir "$env:RUNNER_TEMP/gpui-packaging-evidence"
          ./tests/test_gpui_msi_property.ps1 -MsiPaths @($msi,$previous,$same)
          ./scripts/test_next_gpui_msi_e2e.ps1 -Msi $msi -PreviousMsi $previous -SameVersionMsi $same -OutputDir "$env:RUNNER_TEMP/gpui-installer-evidence"
        if: runner.os == 'Windows'
      - name: Keep real Windows installer lifecycle evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpui-installer-evidence
          path: |-
            ${{ runner.temp }}/gpui-installer-evidence
            ${{ runner.temp }}/gpui-packaging-evidence
            ${{ runner.temp }}/gpui-real-prior.msi*
            ${{ runner.temp }}/gpui-equal-build-fixture.msi*
            dist/*.wixpdb
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: next-${{ matrix.platform }}
          # Only final deliverables enter the publisher; WiX PDBs stay diagnostic.
          path: |
            dist/XenTerm-Next-beta-${{ inputs.source_sha }}-${{ matrix.platform }}.zip
            dist/XenTerm-Next-beta-${{ inputs.source_sha }}-${{ matrix.platform }}.tar.gz
            dist/XenTerm-Next-beta-${{ inputs.source_sha }}-${{ matrix.platform }}.msi
            dist/XenTerm-Next-beta-${{ inputs.source_sha }}-${{ matrix.platform }}.msi.json
          if-no-files-found: error
          retention-days: 7

  verify-artifacts:
    timeout-minutes: 20
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CI_RUN_ID: ${{ inputs.ci_run }}
      XENTERM_VERSION_METADATA: ${{ needs.prepare.outputs.version_metadata }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: next-*
          merge-multiple: true
          path: dist
      - name: Validate all archives and generate checksums without publishing
        run: |
          python3 - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from next_beta import prepare_assets
          prepare_assets(Path('dist'), os.environ['SOURCE_SHA'], os.environ['CI_RUN_ID'], os.environ['GITHUB_RUN_ID'])
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: next-manifests
          path: |
            dist/*-BUILD.json
            dist/*-SHA256SUMS
          if-no-files-found: error
          retention-days: 7
