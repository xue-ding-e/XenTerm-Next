name: Release

# One workflow, one artifact set (same platforms, same AppImage / .deb / MSI /
# Flatpak / glibc-2.28 tarballs as before — only the version strings differ):
#  - push a tag `vX.Y.Z`  -> stable mode; once every build succeeds, all
#    artifacts attach to the GitHub Release in one step (no partial releases).
#  - push to main         -> beta mode; replaces the single rolling `beta`
#    pre-release. Feature branches never build releases (ci.yml covers them).
#  - workflow_dispatch    -> mode input: `beta` (default, publish rolling beta),
#    `stable` (attach to the selected tag's release — retry path for a failed
#    tag build), `dry-run` (build artifacts only, publish nothing).
#
# Forks: tag pushes build and attach to the fork's own release (marked
# pre-release, never "latest"); rolling-beta publishing only ever runs in
# ixbaicn/XenTerm.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "beta = rolling beta; stable = attach to the selected tag's release; dry-run = artifacts only"
        type: choice
        options: [beta, stable, dry-run]
        default: beta

permissions:
  contents: write   # needed to create / update the GitHub Release

# Same ref: a newer run cancels the older one (rolling beta). Different tags
# never cancel each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve mode and version
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}           # stable | beta | dry-run
      version: ${{ steps.resolve.outputs.version }}     # vX.Y.Z | beta-<sha7> | dry-run-<sha12>
      runtime_version: ${{ steps.resolve.outputs.runtime_version }}
      deb_version: ${{ steps.resolve.outputs.deb_version }}
      app_version: ${{ steps.resolve.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve mode and version
        id: resolve
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -eu
          # Next's rolling beta has one publisher: next-beta.yml. Preserve the
          # existing formal-tag and dry-run paths, including other repositories.
          if [ "${GITHUB_REPOSITORY:-}" = "xue-ding-e/XenTerm-Next" ] && \
             [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && \
             [ "${INPUT_MODE:-beta}" = "beta" ]; then
            echo "Next beta is published only by next-beta.yml after same-SHA CI."
            exit 1
          fi
          CARGO_VERSION="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            MODE=stable
            VERSION="$GITHUB_REF_NAME"
            DEB_VERSION="${VERSION#v}"
            APP_VERSION="${VERSION#v}"
          elif [ "$INPUT_MODE" = "stable" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "Mode 'stable' requires dispatching on a tag ref (got ${GITHUB_REF_NAME:-<none>})."
              exit 1
            fi
            MODE=stable
            VERSION="$GITHUB_REF_NAME"
            DEB_VERSION="${VERSION#v}"
            APP_VERSION="${VERSION#v}"
          elif [ "$INPUT_MODE" = "dry-run" ]; then
            MODE=dry-run
            # Feature refs contain slashes; they must never become artifact paths.
            VERSION="dry-run-${SOURCE_SHA::12}"
            DEB_VERSION="$CARGO_VERSION"
            APP_VERSION="$CARGO_VERSION"
          else
            MODE=beta
            VERSION="beta-${SOURCE_SHA::7}"
            # Unlike a tag ("v0.7.3"), "beta-<sha>" is not a valid Debian
            # upstream version (it must start with a digit), so derive one from
            # Cargo.toml: 0.7.3~beta.<sha7> sorts *before* the 0.7.3 release,
            # which is what a pre-release should do.
            DEB_VERSION="${CARGO_VERSION}~beta.${SOURCE_SHA::7}"
            APP_VERSION="${CARGO_VERSION}-beta"
          fi

          # The manual stable retry must enforce the same tag/manifest gates
          # as a tag push. Runtime versions do not replace package semver.
          if [ "$MODE" = "stable" ]; then
            if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable release requires a plain vX.Y.Z tag (got $VERSION)."
              exit 1
            fi
            LOCK_VERSION="$(awk '
              $0 == "name = \"xenterm\"" { found = 1; next }
              found && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.lock)"
            if [ "${VERSION#v}" != "$CARGO_VERSION" ]; then
              echo "Tag ${VERSION} does not match Cargo.toml version ${CARGO_VERSION}."
              echo "Run: pwsh ./scripts/release.ps1 ${VERSION}"
              exit 1
            fi
            if [ "${VERSION#v}" != "$LOCK_VERSION" ]; then
              echo "Tag ${VERSION} does not match Cargo.lock xenterm version ${LOCK_VERSION}."
              echo "Run: pwsh ./scripts/release.ps1 ${VERSION}"
              exit 1
            fi
          fi

          # Resolve once for every platform, using the checked-out source and
          # no inherited runtime/package override. The beta release always uses
          # the resolver's rolling-beta context, including dispatches on a tag.
          RUNTIME_REF_TYPE="$GITHUB_REF_TYPE"
          RUNTIME_REF_NAME="$GITHUB_REF_NAME"
          if [ "$MODE" = "beta" ]; then
            RUNTIME_REF_TYPE=tag
            RUNTIME_REF_NAME=beta
          fi
          VERSION_JSON="$(mktemp)"
          trap 'rm -f "$VERSION_JSON"' EXIT
          RUNTIME_VERSION="$(env -u VERSION -u XT_VERSION -u XT_CHANNEL \
            GITHUB_SHA="$SOURCE_SHA" GITHUB_REF_TYPE="$RUNTIME_REF_TYPE" \
            GITHUB_REF_NAME="$RUNTIME_REF_NAME" XT_VERSION_JSON="$VERSION_JSON" \
            bash scripts/version.sh)"
          echo "mode=$MODE"               >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"         >> "$GITHUB_OUTPUT"
          echo "runtime_version=$RUNTIME_VERSION" >> "$GITHUB_OUTPUT"
          echo "deb_version=$DEB_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

  # Fork pushes to main must not burn 8 release-build jobs on a rolling beta
  # they will never publish; everything else builds everywhere.
  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.mode != 'beta' || github.repository == 'ixbaicn/XenTerm' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      XT_VERSION: ${{ needs.prepare.outputs.runtime_version }}
      DEB_VERSION: ${{ needs.prepare.outputs.deb_version }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            bin: xenterm.exe
          - os: ubuntu-22.04            # build on the oldest supported runner for
            target: x86_64-unknown-linux-gnu   # broader glibc compatibility
            name: linux-x86_64
            bin: xenterm
          - os: ubuntu-22.04-arm       # free native arm64 runner (public repos)
            target: aarch64-unknown-linux-gnu  # builds the Linux ARM64 .tar.gz (#82)
            name: linux-aarch64
            bin: xenterm
          - os: macos-14               # Apple Silicon
            target: aarch64-apple-darwin
            name: macos-aarch64
            bin: xenterm
          - os: macos-14               # Cross-compile Intel Mac on Apple Silicon
            target: x86_64-apple-darwin
            name: macos-x86_64
            bin: xenterm
    steps:
      - uses: actions/checkout@v4

      # The native GUI stack the build links against needs these system libs.
      # Build-time only — no GPU/display required to compile.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary version
        shell: bash
        run: |
          set -eu
          ACTUAL="$(target/${{ matrix.target }}/release/${{ matrix.bin }} --version)"
          test "$ACTUAL" = "xenterm ${XT_VERSION}"

      # AppImage stays best-effort so a tooling failure does not block the tarball.
      # MSI and PKG are required outputs on their respective platforms.
      - name: Build AppImage
        if: matrix.name == 'linux-x86_64'
        continue-on-error: true           # don't block the .tar.gz if AppImage fails
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # no FUSE needed in CI
        run: |
          set -eu
          wget -q -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-appimage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-appimage

          install -Dm755 target/${{ matrix.target }}/release/xenterm AppDir/usr/bin/xenterm
          install -Dm644 assets/xenterm.desktop          AppDir/usr/share/applications/xenterm.desktop
          install -Dm644 assets/icon@512.png               AppDir/usr/share/icons/hicolor/512x512/apps/xenterm.png

          # --output appimage already invokes the plugin; --plugin appimage is redundant and causes an error
          ./linuxdeploy --appdir AppDir --output appimage

          mv xenterm*.AppImage "xenterm-${VERSION}-linux-x86_64.AppImage"
          echo "APPIMAGE=xenterm-${VERSION}-linux-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Build Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) DEB_ARCH=amd64 ;;
            aarch64-unknown-linux-gnu) DEB_ARCH=arm64 ;;
            *) echo "Unsupported Debian architecture: ${{ matrix.target }}"; exit 1 ;;
          esac

          ROOT="deb-root"
          install -Dm755 "target/${{ matrix.target }}/release/xenterm" "$ROOT/usr/bin/xenterm"
          install -Dm644 assets/xenterm.desktop "$ROOT/usr/share/applications/xenterm.desktop"
          install -Dm644 assets/icon@512.png "$ROOT/usr/share/icons/hicolor/512x512/apps/xenterm.png"
          install -Dm644 THIRD_PARTY_NOTICES.md "$ROOT/usr/share/doc/xenterm/THIRD_PARTY_NOTICES.md"
          install -d "$ROOT/DEBIAN"

          # dpkg-shlibdeps expects source-package metadata in debian/control,
          # even when -O prints the generated dependency variable to stdout.
          # Without this file it exits with code 25 on both Linux runners.
          install -d debian
          cat > debian/control <<'EOF'
          Source: xenterm
          Section: net
          Priority: optional
          Maintainer: XenTerm contributors
          Standards-Version: 4.6.2

          Package: xenterm
          Architecture: any
          Depends: ${shlibs:Depends}
          Description: Lightweight SSH, SFTP, and terminal client
          EOF
          DEPENDS="$(dpkg-shlibdeps -O -e"$ROOT/usr/bin/xenterm" | sed -n 's/^shlibs:Depends=//p')"
          test -n "$DEPENDS"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: xenterm
          Version: ${DEB_VERSION}
          Section: net
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: XenTerm contributors
          Depends: ${DEPENDS}
          Homepage: https://github.com/ixbaicn/XenTerm
          Description: Lightweight SSH, SFTP, and terminal client
           XenTerm is a cross-platform terminal client written in Rust and GPUI.
          EOF

          DEB="xenterm-${VERSION}-linux-${DEB_ARCH}.deb"
          dpkg-deb --root-owner-group --build "$ROOT" "$DEB"
          dpkg-deb --info "$DEB"
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          set -eu
          STAGE="xenterm-${VERSION}-${{ matrix.name }}"

          if [ "${{ runner.os }}" = "macOS" ]; then
            # ── Build a proper .app bundle ────────────────────────────────────
            # Without a bundle macOS opens raw binaries in Terminal.app, which
            # stays alive after the app exits and never shows a Dock icon.
            APP="xenterm.app"
            CONTENTS="$APP/Contents"
            mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"

            cp "target/${{ matrix.target }}/release/xenterm" "$CONTENTS/MacOS/"
            cp THIRD_PARTY_NOTICES.md "$CONTENTS/Resources/"

            # Generate .icns from the 512×512 PNG using sips + iconutil (both
            # ship with every macOS, no extra tooling needed in CI).
            mkdir -p xenterm.iconset
            sips -z 16  16  "assets/icon@512.png" --out xenterm.iconset/icon_16x16.png       >/dev/null
            sips -z 32  32  "assets/icon@512.png" --out xenterm.iconset/icon_16x16@2x.png    >/dev/null
            sips -z 32  32  "assets/icon@512.png" --out xenterm.iconset/icon_32x32.png        >/dev/null
            sips -z 64  64  "assets/icon@512.png" --out xenterm.iconset/icon_32x32@2x.png    >/dev/null
            sips -z 128 128 "assets/icon@512.png" --out xenterm.iconset/icon_128x128.png     >/dev/null
            sips -z 256 256 "assets/icon@512.png" --out xenterm.iconset/icon_128x128@2x.png  >/dev/null
            sips -z 256 256 "assets/icon@512.png" --out xenterm.iconset/icon_256x256.png     >/dev/null
            sips -z 512 512 "assets/icon@512.png" --out xenterm.iconset/icon_256x256@2x.png  >/dev/null
            sips -z 512 512 "assets/icon@512.png" --out xenterm.iconset/icon_512x512.png     >/dev/null
            iconutil -c icns xenterm.iconset -o "$CONTENTS/Resources/xenterm.icns"

            sed "s/__VERSION__/${APP_VERSION}/g" assets/Info.plist > "$CONTENTS/Info.plist"

            # Ad-hoc code-sign the assembled bundle.
            # The release profile strips the binary (Cargo.toml: strip = "symbols"),
            # which invalidates the linker's automatic ad-hoc signature — on Apple
            # Silicon that makes the OS refuse to launch it ("app is damaged").
            # Re-signing the whole bundle here restores a valid (ad-hoc) signature,
            # turning the fatal "damaged" error into the normal "unidentified
            # developer" prompt that users can bypass via Open Anyway / xattr.
            codesign --force --deep --sign - "$APP"
            codesign --verify --verbose "$APP"

            # Package with ditto (Apple's tool) — it preserves the bundle's
            # signature and metadata. Plain `zip` mangles them and re-breaks the
            # signature, which would reintroduce the "damaged" error.
            ditto -c -k --keepParent "$APP" "${STAGE}.zip"
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"
            # Keep the portable bundle and add Apple's native choice-based installer.
            # A release is not notarized unless maintainers configure that separately.
            # Installer package versions are numeric, unlike beta artifact labels.
            PKG_VERSION="${APP_VERSION%%[-+]*}"
            bash packaging/macos/build-pkg.sh "$APP" "$PKG_VERSION" "${STAGE}.pkg"
            echo "PKG=${STAGE}.pkg" >> "$GITHUB_ENV"

          elif [ "${{ runner.os }}" = "Windows" ]; then
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            cp README.md README.zh.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
            7z a "${STAGE}.zip" "$STAGE" >/dev/null
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

          else
            # Linux
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            cp README.md README.zh.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
            # Ship the desktop entry + installer + icon so the dock shows the icon.
            cp assets/xenterm.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
            tar -czf "${STAGE}.tar.gz" "$STAGE"
            echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi

      # MSI installer with native integration choices and installation-directory Browse.
      # Product/@Version comes from Cargo.toml via cargo-wix, so the packaged
      # version is the crate version regardless of the artifact version string.
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.name == 'windows-x86_64'
        with:
          arch: x64
      - name: Build MSI installer (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          # WiX 3 toolset (candle/light) that cargo-wix drives.
          choco install wixtoolset -y --no-progress
          $candle = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($candle) { $env:PATH = "$($candle.DirectoryName);$env:PATH" }
          cargo install cargo-wix --locked
          ./wix/build-custom-actions.ps1
          cargo wix --no-build --nocapture --target ${{ matrix.target }} --output "xenterm-$env:VERSION-windows-x86_64.msi"
          echo "MSI=xenterm-$env:VERSION-windows-x86_64.msi" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

      - name: Upload AppImage artifact
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-appimage
          path: ${{ env.APPIMAGE }}

      - name: Upload Debian package artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-deb
          path: ${{ env.DEB }}

      - name: Upload macOS Installer artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-pkg
          path: ${{ env.PKG }}
          if-no-files-found: error

      - name: Upload MSI artifact
        if: matrix.name == 'windows-x86_64' && env.MSI != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-msi
          path: ${{ env.MSI }}
          if-no-files-found: error

  build-flatpak:
    name: linux-x86_64-flatpak
    needs: [prepare, build]
    if: needs.prepare.outputs.mode != 'beta' || github.repository == 'ixbaicn/XenTerm' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      XT_VERSION: ${{ needs.prepare.outputs.runtime_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x86_64 package
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist

      - name: Restore prebuilt binary for Flatpak manifest
        shell: bash
        run: |
          set -eu
          tar -xzf dist/*.tar.gz -C dist
          BINARY="$(find dist -type f -name xenterm -perm -111 -print -quit)"
          test -n "$BINARY"
          install -Dm755 "$BINARY" target/x86_64-unknown-linux-gnu/release/xenterm

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: xenterm-${{ env.VERSION }}-linux-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.yituorou.xenterm.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-flatpak
          path: xenterm-${{ env.VERSION }}-linux-x86_64.flatpak

  build-glibc228:
    name: linux-${{ matrix.arch }}-glibc228
    needs: prepare
    if: needs.prepare.outputs.mode != 'beta' || github.repository == 'ixbaicn/XenTerm' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    container: debian:10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      XT_VERSION: ${{ needs.prepare.outputs.runtime_version }}

    steps:
      - name: Prepare Debian 10 build dependencies
        shell: bash
        run: |
          set -eu
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99archive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils file tar \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-glibc228-${{ matrix.target }}

      - name: Build (release)
        shell: bash
        run: |
          set -eu
          . "$HOME/.cargo/env"
          rustc --version
          cargo build --release --target ${{ matrix.target }}

      - name: Verify binary version
        shell: bash
        run: |
          set -eu
          ACTUAL="$(target/${{ matrix.target }}/release/xenterm --version)"
          test "$ACTUAL" = "xenterm ${XT_VERSION}"

      - name: Verify glibc baseline
        shell: bash
        run: |
          set -eu
          ldd --version | sed -n '1p'
          file target/${{ matrix.target }}/release/xenterm
          objdump -T target/${{ matrix.target }}/release/xenterm \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -n 10 || true

      - name: Package
        shell: bash
        run: |
          set -eu
          STAGE="xenterm-${VERSION}-linux-${{ matrix.arch }}-glibc228"

          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/xenterm" "$STAGE/"
          cp README.md README.zh.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
          cp assets/xenterm.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-glibc228
          path: ${{ env.ASSET }}

  publish:
    name: Publish
    needs: [prepare, build, build-flatpak, build-glibc228]
    if: needs.prepare.outputs.mode != 'dry-run'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Attach all artifacts to the GitHub Release
        if: needs.prepare.outputs.mode == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          # Custom fork builds must stay separate from upstream stable releases.
          prerelease: ${{ github.repository != 'ixbaicn/XenTerm' }}
          make_latest: ${{ github.repository == 'ixbaicn/XenTerm' && 'true' || 'false' }}
          files: dist/*
          fail_on_unmatched_files: true

      - name: Replace the rolling beta release
        # Fork releases must never touch the upstream's rolling beta.
        if: needs.prepare.outputs.mode == 'beta' && (github.repository == 'ixbaicn/XenTerm' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Drop the rolling beta release/tag...
          gh release delete beta --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          # Versioned preview releases belong to the user and are never purged.
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create beta dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Beta (${SHORT_SHA})" \
            --notes "自动构建的预览版（beta），来自 commit ${SHORT_SHA}。每次代码提交都会替换此预览版，始终只保留最新一个。"

