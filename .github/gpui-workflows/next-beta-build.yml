name: Build XenTerm Next portable artifacts

# Read-only reusable packaging. No release/tag API, write token or secrets.
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      ci_run:
        required: true
        type: string
    outputs:
      version_metadata:
        description: Runtime and package version resolved once for this build
        value: ${{ jobs.prepare.outputs.version_metadata }}

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      xt_version: ${{ steps.version.outputs.xt_version }}
      version_metadata: ${{ steps.version.outputs.version_metadata }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Resolve one product runtime version for every platform
        id: version
        run: python3 scripts/packaging_version.py . --source-sha "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Release packaging shares the same one-heavy-runner budget as CI.
      max-parallel: 1
      matrix:
        include:
          - {os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64}
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64}
          - {os: macos-14, target: aarch64-apple-darwin, platform: macos-aarch64}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CI_RUN_ID: ${{ inputs.ci_run }}
      TARGET: ${{ matrix.target }}
      XENTERM_PACKAGE_PLATFORM: ${{ matrix.platform }}
      XT_VERSION: ${{ needs.prepare.outputs.xt_version }}
      XENTERM_VERSION_METADATA: ${{ needs.prepare.outputs.version_metadata }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, verified 2026-10-14
        with:
          targets: ${{ matrix.target }}
      - name: Use static Microsoft C runtime for portable Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - name: Build locked release
        run: cargo build --locked --release --target ${{ matrix.target }} --jobs 2
      - name: Reject unpackaged Microsoft runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deps = & dumpbin /DEPENDENTS "target/$env:TARGET/release/xenterm.exe"
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          $deps | Out-Host
          if (($deps -join "`n") -match '(?i)(VCRUNTIME|MSVCP|CONCRT)\d+[^\s]*\.dll') {
            throw 'Portable EXE still needs unpackaged Microsoft C++ runtime DLLs'
          }
      - name: Package and verify binary version
        run: python3 scripts/next_beta_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: next-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify-artifacts:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CI_RUN_ID: ${{ inputs.ci_run }}
      XENTERM_VERSION_METADATA: ${{ needs.prepare.outputs.version_metadata }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: next-*
          merge-multiple: true
          path: dist
      - name: Validate all archives and generate checksums without publishing
        run: |
          python3 - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from next_beta import prepare_assets
          prepare_assets(Path('dist'), os.environ['SOURCE_SHA'], os.environ['CI_RUN_ID'], os.environ['GITHUB_RUN_ID'])
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: next-manifests
          path: |
            dist/*-BUILD.json
            dist/*-SHA256SUMS
          if-no-files-found: error
          retention-days: 7
