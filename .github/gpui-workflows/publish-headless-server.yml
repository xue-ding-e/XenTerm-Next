name: Publish verified headless server preview
on:
  push:
    branches: [build/headless-issue1-20261014]
    paths: [.github/workflows/publish-headless-server.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-headless-2c8da5b8486c
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'xue-ding-e/XenTerm-Next'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify immutable build and download exact artifact
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto');
            const {owner, repo} = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: 38632922179});
            if (run.status !== 'completed' || run.conclusion !== 'success' ||
                run.head_sha !== 'a8184e55d571096f26133c941b4fad228fc5af12' ||
                run.path !== '.github/workflows/headless-server.yml' || run.event !== 'push' ||
                run.repository.full_name !== 'xue-ding-e/XenTerm-Next' ||
                run.head_repository.full_name !== run.repository.full_name) throw new Error('Build provenance mismatch');
            const {data: artifact} = await github.rest.actions.getArtifact({owner, repo, artifact_id: 11927246589});
            if (artifact.expired || artifact.workflow_run.id !== run.id ||
                artifact.name !== 'headless-linux-x86_64-2c8da5b') throw new Error('Artifact mismatch');
            const result = await github.rest.actions.downloadArtifact({owner, repo, artifact_id: artifact.id, archive_format: 'zip'});
            const bytes = Buffer.from(result.data);
            if (crypto.createHash('sha256').update(bytes).digest('hex') !==
                '7281d7154221a51659d752bf13939f2c33c1d0fe2832d797155fb3096747333b') throw new Error('Artifact digest mismatch');
            fs.writeFileSync('artifact.zip', bytes);
      - name: Verify archive and source manifest without executing binary
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile, zipfile
          archive = 'xenterm-next-2c8da5b8486c-headless-linux-x86_64.tar.gz'
          with zipfile.ZipFile('artifact.zip') as z:
              assert sorted(z.namelist()) == sorted([archive, 'BUILD.json', 'SHA256SUMS'])
              z.extractall('dist')
          d = pathlib.Path('dist')
          sha, name = (d/'SHA256SUMS').read_text().strip().split()
          assert name == archive
          assert sha == 'd2a30625ecc2cb811dee8cf997cd81c085a37a57268f16b4c6187fcff9020073'
          assert hashlib.sha256((d/name).read_bytes()).hexdigest() == sha
          m = json.loads((d/'BUILD.json').read_text())
          assert m['source_sha'] == '2c8da5b8486c9865a5d769766f5051bcf4998571'
          assert m['tooling_sha'] == 'a8184e55d571096f26133c941b4fad228fc5af12'
          assert m['build_run'] == '38632922179' and m['source_ci_run'] == '38629573194'
          stem = archive.removesuffix('.tar.gz')
          with tarfile.open(d/archive) as t:
              assert json.load(t.extractfile(stem+'/BUILD.json')) == m
              actual = hashlib.sha256(t.extractfile(stem+'/xenterm').read()).hexdigest()
              assert actual == m['binary_sha256'] == '3cd95b1f5b6bf3046b208ce9698158ca1567cfe299e2b823225a8ad5698ffd80'
          PY
      - name: Publish a distinct immutable-source prerelease
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto');
            const {owner, repo} = context.repo;
            const tag = 'headless-2c8da5b8486c';
            const source = '2c8da5b8486c9865a5d769766f5051bcf4998571';
            // A rerun never replaces an existing tag/release or overwrites assets.
            for (const request of [() => github.rest.git.getRef({owner, repo, ref: `tags/${tag}`}),
                                   () => github.rest.repos.getReleaseByTag({owner, repo, tag})]) {
              try { await request(); throw new Error('Target already exists; inspect before retrying'); }
              catch (error) { if (error.status !== 404) throw error; }
            }
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            if (releases.some(r => r.tag_name === tag)) throw new Error('Existing draft or published release');
            // Atomic create fails if another actor created the tag since our read.
            await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha: source});
            const verifyTag = async () => {
              const {data: ref} = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              if (ref.object.sha !== source || ref.object.type !== 'commit') throw new Error('Tag changed');
            };
            await verifyTag();
            const body = `独立服务器 headless 预发布，不替换桌面 beta。\n\n产品源码: ${source}\n构建工具: a8184e55d571096f26133c941b4fad228fc5af12\n源CI: https://github.com/${owner}/${repo}/actions/runs/38629573194\n构建及真实release stdio回归: https://github.com/${owner}/${repo}/actions/runs/38632922179\n\nUbuntu 22.04 x86_64构建，最高GLIBC 2.34，仅依赖libc/libm/libgcc_s/loader。含MIT及第三方许可证。部署前需一致性profile备份及兼容性检查；不是glibc2.28产物。请核验SHA256SUMS和BUILD.json。`;
            const {data: release} = await github.rest.repos.createRelease({owner, repo, tag_name: tag,
              target_commitish: source, name: 'XenTerm Next headless 2c8da5b (Ubuntu 22.04)',
              body, draft: true, prerelease: true, make_latest: 'false'});
            for (const name of fs.readdirSync('dist').sort()) {
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id,
                name, data: fs.readFileSync(`dist/${name}`)});
            }
            const {data: assets} = await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id});
            const names = fs.readdirSync('dist').sort();
            if (JSON.stringify(assets.map(a => a.name).sort()) !== JSON.stringify(names) ||
                assets.some(a => a.state !== 'uploaded' || a.size !== fs.statSync(`dist/${a.name}`).size ||
                  a.digest !== 'sha256:' + crypto.createHash('sha256').update(fs.readFileSync(`dist/${a.name}`)).digest('hex'))) {
              throw new Error('Asset name/size/digest mismatch; keep draft');
            }
            await verifyTag();
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false, prerelease: true, make_latest: 'false'});
            await verifyTag();
            await core.summary.addHeading('Headless server preview published').addRaw(`Source ${source}; build 38632922179. Separate from rolling desktop beta.`).write();
