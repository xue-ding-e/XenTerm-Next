id: io.github.yituorou.xenterm
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: xenterm
default-branch: stable

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # XenTerm uploads/downloads arbitrary user-selected files and can open
  # local terminal sessions. Keep host-home access until those paths use
  # portals throughout the application.
  - --filesystem=home
  # Required for serial sessions (/dev/ttyUSB*, /dev/ttyACM*, and similar).
  - --device=all

modules:
  - name: xenterm
    buildsystem: simple
    build-commands:
      - install -Dm755 xenterm /app/bin/xenterm
      - install -Dm644 io.github.yituorou.xenterm.desktop /app/share/applications/io.github.yituorou.xenterm.desktop
      - install -Dm644 io.github.yituorou.xenterm.metainfo.xml /app/share/metainfo/io.github.yituorou.xenterm.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.yituorou.xenterm.png
      - install -Dm644 THIRD_PARTY_NOTICES.md /app/share/doc/xenterm/THIRD_PARTY_NOTICES.md
    sources:
      - type: file
        path: ../../target/x86_64-unknown-linux-gnu/release/xenterm
        dest-filename: xenterm
      - type: file
        path: io.github.yituorou.xenterm.desktop
      - type: file
        path: io.github.yituorou.xenterm.metainfo.xml
      - type: file
        path: ../../assets/icon@512.png
        dest-filename: icon.png
      - type: file
        path: ../../THIRD_PARTY_NOTICES.md
