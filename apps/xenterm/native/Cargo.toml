[package]
name = "xenterm-bridge"
version = "0.1.0"
edition = "2021"
description = "The Flutter frontend's FFI bridge onto the xenterm service core (docs/flutter-bridge.md)"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# The service core, and nothing else. This crate is a translation layer: it
# maps the core's models onto C-ABI/JSON DTOs, and the core keeps zero
# knowledge of any frontend (arch_guards enforces that boundary).
xenterm = { path = "../../../crates/xenterm" }
serde_json = "1"
# The bridge owns the tokio runtime the session workers run on. Same crate and
# version as the core's dependency (Cargo unifies), not a second async stack.
tokio = { version = "1", features = ["rt-multi-thread"] }

