[workspace]
resolver = "2"
members = ["crates/xenterm", "apps/xenterm/native"]

# The workspace is the repository: everything Rust lives under crates/, so the
# root stays a manifest and nothing else. The lockfile is shared — one `cargo
# build` at the root builds every member, and a `cargo update` cannot drift the
# members apart.
#
# Central versioning note (docs/versioning.md): the crate's own version is the
# product version and stays in crates/xenterm/Cargo.toml; release tooling reads
# it there.
#
# Profiles live here and only here: Cargo ignores (and newer versions reject)
# profile sections in member manifests.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# Deliberately NOT "abort". Plugin fault isolation does not depend on this any
# more — plugins are separate processes, so a faulty one takes its own address
# space with it and there is nothing here to catch or to miss. What still needs
# unwinding is this process: the plugin host and the terminal both spawn threads
# around blocking OS handles, and a panic on one of them must not take the
# application down. Under panic = "abort" it would. Costs some binary size and
# a little codegen quality; that trade is worth more than the optimisation here.
#
# Known consequence: panics in spawned threads surface as an Err join result
# instead of killing the process, and at least one site discards it — the
# serial reader's join is one, so a panicking reader is swallowed and shutdown
# reports a clean close. The plugin host's pipe threads are detached on
# purpose and for a different reason: they end when their pipe closes, so
# there is nothing left to join by the time anyone would want to.
panic = "unwind"

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 1
