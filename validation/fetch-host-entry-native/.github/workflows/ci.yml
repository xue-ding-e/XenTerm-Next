name: Fetch Host entry synthetic qualification (manual)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: xenterm-owned-native-fixtures
  cancel-in-progress: false
jobs:
  synthetic:
    if: github.repository == 'xue-ding-e/XenTerm-Next' && github.ref == 'refs/heads/validation/xenterm-fetch-host-entry-20261031' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      EXPECTED_CONTROL_SHA: ${{ inputs.expected_sha }}
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Only synthetic Host entry cases
        shell: pwsh
        timeout-minutes: 6
        run: ./validation/fetch-host-entry-native/run-host-entry.ps1
      - name: Upload sanitized metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fetch-host-entry-native-metadata
          path: ${{ runner.temp }}/xenterm-host-entry-${{ github.sha }}/metadata.json
          if-no-files-found: ignore
          retention-days: 7
